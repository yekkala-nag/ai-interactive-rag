<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c10" />
    
    <!-- Primary Meta Tags -->
    <title>Modern AI Engineering — Interactive AI Systems & RAG Knowledge Base</title>
    <meta name="title" content="Modern AI Engineering — Interactive AI Systems & RAG Knowledge Base" />
    <meta name="description" content="Comprehensive interactive lab and knowledge base covering 35 modules across AI Engineering, RAG Systems, Context Engineering, Memory Systems, Multi-Agent Workflows, and Claude Architecture." />
    <meta name="keywords" content="RAG, Retrieval Augmented Generation, AI Engineering, LLM, Vector Database, Hybrid Search, Multi-Agent Systems, Context Engineering, Memory Systems, LangGraph, Claude" />
    <meta name="author" content="AI Engineering Team" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Modern AI Engineering — Interactive AI Systems & RAG Knowledge Base" />
    <meta property="og:description" content="Interactive lab and reference architecture covering RAG pipelines, context graphs, agent loops, active learning, and production LLM engineering." />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Modern AI Engineering — Interactive AI Systems & RAG Knowledge Base" />
    <meta property="twitter:description" content="Interactive lab and reference architecture covering RAG pipelines, context graphs, agent loops, active learning, and production LLM engineering." />

    <!-- Base Styling to Prevent FOUC -->
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        background-color: #0b0c10;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
      }

      /* Custom Visible Scrollbar Styling */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #f1efe9;
        border-radius: 6px;
      }
      ::-webkit-scrollbar-thumb {
        background: #2a8a84;
        border-radius: 6px;
        border: 2px solid #f1efe9;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #1d6a65;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: #2a8a84 #f1efe9;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
