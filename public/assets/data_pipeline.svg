<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs><linearGradient id="dpbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#101a30"/></linearGradient>
<linearGradient id="dpblu" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
<linearGradient id="dpgrn" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient></defs>
<rect width="1200" height="400" fill="url(#dpbg)" rx="12"/>
<text x="40" y="48" fill="#fff" font-size="24" font-weight="800">Streaming → lineage → versioned promotion (test bytes, not prod)</text>
<text x="40" y="72" fill="#94a3b8" font-size="13">Partitions ≈ max(rate/per-part, consumers) · lineage answers audits · LakeFS branches gate rag evals.</text>
<g font-size="12" font-weight="700">
<rect x="40" y="100" width="330" height="100" rx="10" fill="url(#dpblu)"/><text x="56" y="128" fill="#fff">Kafka/Flink stream</text><text x="56" y="150" fill="#e0f2fe" font-weight="400">topics+partitions · windows</text><text x="56" y="170" fill="#e0f2fe" font-weight="400">checkpoints · schema reg</text><text x="56" y="190" fill="#fff" font-weight="400">idempotent sinks</text>
<rect x="390" y="100" width="330" height="100" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><text x="406" y="128" fill="#38bdf8">Lineage (OpenLineage)</text><text x="406" y="150" fill="#e2e8f0" font-weight="400">column-level origin</text><text x="406" y="170" fill="#e2e8f0" font-weight="400">where did premium come from?</text><text x="406" y="190" fill="#64748b" font-weight="400">Marquez · Unity</text>
<rect x="740" y="100" width="420" height="100" rx="10" fill="url(#dpgrn)"/><text x="756" y="128" fill="#fff">Version (DVC/LakeFS) + gate</text><text x="756" y="150" fill="#d1fae5" font-weight="400">staging branch → rag eval → merge prod</text><text x="756" y="170" fill="#d1fae5" font-weight="400">diff v3↔v4 · which bytes trained it?</text><text x="756" y="190" fill="#fff" font-weight="400">Ship-gate promotes bytes</text>
</g>
<rect x="40" y="220" width="1120" height="60" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="244" fill="#fff" font-size="12" font-weight="700">Lineage trail: kafka:claims(v7) → flink:dedup+window → lakefs:silver@prod → rag:index #441 → 2.1M chunks</text>
<text x="60" y="266" fill="#94a3b8" font-size="11">Exactly-once costs 2x — ask if you need it before paying. Breaking schema changes die in CI.</text>
<rect x="40" y="295" width="1120" height="65" rx="10" fill="#0f172a" stroke="#c9a84c"/>
<text x="60" y="319" fill="#c9a84c" font-size="12" font-weight="800">Simulator: events/s → partitions + lag risk + full lineage trail.</text>
<text x="60" y="341" fill="#e2e8f0" font-size="11">Retrieval tests new bytes on staging; prod moves only on Ship.</text>
</svg>
