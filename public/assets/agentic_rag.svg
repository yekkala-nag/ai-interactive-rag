<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="Syne, sans-serif">
<rect width="1000" height="360" fill="#f7f5f0"/>
<text x="500" y="40" font-family="Syne, sans-serif" font-size="Agentic RAG — Reason, Retrieve, Repeat" font-weight="800" fill="#c4572a" text-anchor="middle">Agentic RAG — Reason, Retrieve, Repeat</text>
<rect x="120" y="140" width="200" height="70" rx="10" fill="#1a1a2e" stroke="#c9a84c" stroke-width="2"/>
<text x="220" y="175" font-family="Syne, sans-serif" font-size="🤖 Think" font-weight="800" fill="#c9a84c" text-anchor="middle">🤖 Think</text>
<line x1="320" y1="175" x2="420" y2="175" stroke="#c4572a" stroke-width="2.5" marker-end="url(#ah6)"/>
<rect x="420" y="140" width="200" height="70" rx="10" fill="#c4572a14" stroke="#c4572a" stroke-width="2"/>
<text x="520" y="175" font-family="Syne, sans-serif" font-size="🔍 Search" font-weight="800" fill="#c4572a" text-anchor="middle">🔍 Search</text>
<line x1="620" y1="175" x2="720" y2="175" stroke="#c4572a" stroke-width="2.5" marker-end="url(#ah6)"/>
<rect x="720" y="140" width="200" height="70" rx="10" fill="#fff" stroke="#c4572a" stroke-width="2"/>
<text x="820" y="175" font-family="Syne, sans-serif" font-size="✅ Answer?" font-weight="800" fill="#c4572a" text-anchor="middle">✅ Answer?</text>
<line x1="820" y1="140" x2="820" y2="90" stroke="#9b7fd4" stroke-width="2.5"/>
<rect x="720" y="40" width="200" height="60" rx="10" fill="#9b7fd4 14" stroke="#9b7fd4" stroke-width="2"/>
<text x="820" y="72" font-family="Syne, sans-serif" font-size="refine query → loop" font-weight="800" fill="#9b7fd4" text-anchor="middle">refine query → loop</text>
<line x1="720" y1="70" x2="620" y2="140" stroke="#9b7fd4" stroke-width="2" marker-end="url(#5)"/>
<defs><marker id="ah6" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#c4572a"/></marker></defs>
<text x="500" y="300" font-family="Syne, sans-serif" font-size="The LLM decides how many retrieval rounds — reformulating the query until it can answer confidently." font-weight="600" fill="#6a6a7a" text-anchor="middle">The LLM decides how many retrieval rounds — reformulating the query until it can answer confidently.</text>
<text x="500" y="325" font-family="Syne, sans-serif" font-size="Cap iterations to avoid runaway loops." font-weight="700" fill="#9b7fd4" text-anchor="middle">Cap iterations to avoid runaway loops.</text>
</svg>