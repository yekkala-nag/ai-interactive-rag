<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs><linearGradient id="mhbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#101a30"/></linearGradient>
<linearGradient id="mhgrn" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
<linearGradient id="mhblu" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
<linearGradient id="mhamb" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
<linearGradient id="mhred" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/></linearGradient></defs>
<rect width="1200" height="480" fill="url(#mhbg)" rx="12"/>
<text x="40" y="48" fill="#fff" font-size="24" font-weight="800">Memory hierarchy — hot working → episodic → semantic → cold</text>
<text x="40" y="72" fill="#94a3b8" font-size="13">Route by score = 0.6·salience + 0.3·recency + 0.1·frequency · PII quarantined before scoring.</text>
<g font-size="12" font-weight="700">
<rect x="40" y="100" width="250" height="120" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><text x="56" y="128" fill="#38bdf8">⚡ Working (instant)</text><text x="56" y="150" fill="#e2e8f0" font-weight="400">current session · 4k–1M tok</text><text x="56" y="170" fill="#e2e8f0" font-weight="400">evict: compact/summarise</text><text x="56" y="198" fill="#64748b" font-weight="400">open task + recent turns</text>
<rect x="310" y="100" width="250" height="120" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/><text x="326" y="128" fill="#f59e0b">🧠 Episodic (ms)</text><text x="326" y="150" fill="#e2e8f0" font-weight="400">past sessions · scored</text><text x="326" y="170" fill="#e2e8f0" font-weight="400">evict: salience forgetting</text><text x="326" y="198" fill="#64748b" font-weight="400">prefs · corrections</text>
<rect x="580" y="100" width="250" height="120" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2"/><text x="596" y="128" fill="#10b981">📚 Semantic (review)</text><text x="596" y="150" fill="#e2e8f0" font-weight="400">durable facts · curated</text><text x="596" y="170" fill="#e2e8f0" font-weight="400">evict: curation only</text><text x="596" y="198" fill="#64748b" font-weight="400">refund = 14 days ✓</text>
<rect x="850" y="100" width="250" height="120" rx="10" fill="#0f172a" stroke="#475569" stroke-width="2"/><text x="866" y="128" fill="#94a3b8">❄ Cold (TTL)</text><text x="866" y="150" fill="#e2e8f0" font-weight="400">audit · unbounded</text><text x="866" y="170" fill="#e2e8f0" font-weight="400">evict: retention policy</text><text x="866" y="198" fill="#64748b" font-weight="400">consent logs · tombstones</text>
</g>
<rect x="40" y="250" width="560" height="90" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="278" fill="#fff" font-size="14" font-weight="800">MemGPT paging loop (working pressure &gt; 85%)</text>
<text x="60" y="300" fill="#e2e8f0" font-size="12">check pressure → LLM page-out call → vector+metadata fetch → page-in pointers</text>
<text x="60" y="322" fill="#64748b" font-size="11">Resume with pointers, never full history.</text>
<rect x="620" y="250" width="540" height="90" rx="10" fill="url(#mhred)" opacity="0.92"/>
<text x="640" y="278" fill="#fff" font-size="14" font-weight="800">PII rule: quarantine BEFORE scoring</text>
<text x="640" y="300" fill="#fecaca" font-size="12">Raw spans → sha256 pointer + TTL · never in working/episodic raw</text>
<text x="640" y="322" fill="#fff" font-size="11">'Forget X' deletes + receipt · contradiction tombstones old (valid_to)</text>
<rect x="40" y="360" width="1120" height="80" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="388" fill="#fff" font-size="13" font-weight="800">Promotion ladder: session-fact → working · unverified → episodic(flagged) · score ≥0.75 → semantic · &lt;0.5 → cold</text>
<text x="60" y="412" fill="#94a3b8" font-size="12">Try the router simulator below: toggle PII / salience / age and watch the tier change.</text>
</svg>
