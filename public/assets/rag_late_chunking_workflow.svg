<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c17"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#090d18"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#a855f7"/>
    </marker>
  </defs>

  <rect width="1200" height="520" fill="url(#bgGrad2)" rx="12"/>

  <!-- Title -->
  <text x="600" y="42" fill="#38bdf8" font-size="20" font-weight="700" text-anchor="middle">TRADITIONAL CHUNKING vs. JINA LATE CHUNKING &amp; ANTHROPIC CONTEXTUAL RETRIEVAL</text>
  <text x="600" y="66" fill="#94a3b8" font-size="13" text-anchor="middle">Why Late Chunking eliminates boundary blindspots via whole-document self-attention layers</text>

  <!-- LEFT: TRADITIONAL CHUNKING PIPELINE -->
  <g transform="translate(50, 95)">
    <rect width="525" height="390" rx="10" fill="url(#blueCard)" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="0" y="0" width="525" height="42" rx="10" fill="#ef4444" fill-opacity="0.12"/>
    <text x="20" y="27" fill="#f87171" font-size="15" font-weight="700">❌ Traditional Early Chunking (Pre-Embedding)</text>

    <!-- Step 1 -->
    <rect x="20" y="58" width="485" height="50" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="80" fill="#e2e8f0" font-size="12" font-weight="600">1. Full Document Ingestion (8k tokens)</text>
    <text x="35" y="98" fill="#94a3b8" font-size="11">"Company ACME reported $4.2B revenue in Q3... [3,000 words] ...due to European headwinds."</text>

    <!-- Arrow Down -->
    <line x1="262" y1="108" x2="262" y2="130" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3"/>

    <!-- Step 2 -->
    <rect x="20" y="132" width="485" height="64" rx="6" fill="#450a0a" fill-opacity="0.4" stroke="#ef4444"/>
    <text x="35" y="154" fill="#f87171" font-size="12" font-weight="600">2. Chunk Slicing (Severed Context)</text>
    <text x="35" y="172" fill="#fca5a5" font-size="11">Chunk #4: "...due to European headwinds." ➔ Zero mention of ACME, revenue, or Q3!</text>
    <text x="35" y="188" fill="#f87171" font-size="10" font-weight="bold">⚠️ Self-Attention is bounded ONLY inside the 200-word chunk</text>

    <!-- Arrow Down -->
    <line x1="262" y1="196" x2="262" y2="218" stroke="#ef4444" stroke-width="2"/>

    <!-- Step 3 -->
    <rect x="20" y="220" width="485" height="50" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="242" fill="#e2e8f0" font-size="12" font-weight="600">3. Embedding Model (Isolated Vector)</text>
    <text x="35" y="260" fill="#94a3b8" font-size="11">Vector: [0.02, -0.41, 0.12...] ➔ Query "ACME Q3 performance" will NEVER match!</text>

    <!-- Result Callout -->
    <rect x="20" y="285" width="485" height="85" rx="6" fill="#090d16" stroke="#1e293b"/>
    <text x="35" y="308" fill="#ef4444" font-size="12" font-weight="bold">Failure Mode: Semantic Amnesia</text>
    <text x="35" y="328" fill="#94a3b8" font-size="11">• Pronouns ("it", "they", "he") lose their referents.</text>
    <text x="35" y="346" fill="#94a3b8" font-size="11">• Table sub-rows lose column headers and metadata.</text>
    <text x="35" y="362" fill="#ef4444" font-size="10" font-weight="bold">Average Retrieval Failure Rate: 32% - 48%</text>
  </g>

  <!-- RIGHT: JINA LATE CHUNKING PIPELINE -->
  <g transform="translate(625, 95)">
    <rect width="525" height="390" rx="10" fill="url(#blueCard)" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="0" y="0" width="525" height="42" rx="10" fill="#a855f7" fill-opacity="0.15"/>
    <text x="20" y="27" fill="#c084fc" font-size="15" font-weight="700">✨ Jina Late Chunking &amp; Contextual Retrieval</text>

    <!-- Step 1 -->
    <rect x="20" y="58" width="485" height="50" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="80" fill="#e2e8f0" font-size="12" font-weight="600">1. Full Document Ingestion (8k tokens)</text>
    <text x="35" y="98" fill="#94a3b8" font-size="11">Entire 8,192 token document is fed into long-context transformer backbone.</text>

    <!-- Arrow Down -->
    <line x1="262" y1="108" x2="262" y2="130" stroke="#a855f7" stroke-width="2"/>

    <!-- Step 2 -->
    <rect x="20" y="132" width="485" height="64" rx="6" fill="#3b0764" fill-opacity="0.5" stroke="#a855f7"/>
    <text x="35" y="154" fill="#d8b4fe" font-size="12" font-weight="600">2. Full-Sequence Bidirectional Self-Attention</text>
    <text x="35" y="172" fill="#e9d5ff" font-size="11">Every token attends to every other token across all 8k positions before pooling.</text>
    <text x="35" y="188" fill="#34d399" font-size="10" font-weight="bold">✨ "headwinds" token vectors now carry deep ACME Q3 semantic coordinates!</text>

    <!-- Arrow Down -->
    <line x1="262" y1="196" x2="262" y2="218" stroke="#a855f7" stroke-width="2"/>

    <!-- Step 3 -->
    <rect x="20" y="220" width="485" height="50" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="35" y="242" fill="#e2e8f0" font-size="12" font-weight="600">3. Late Mean Pooling on Chunk Boundary Spans</text>
    <text x="35" y="260" fill="#94a3b8" font-size="11">Extract token embeddings within span [t_start, t_end] ➔ Mean Pool to 1024d vector.</text>

    <!-- Result Callout -->
    <rect x="20" y="285" width="485" height="85" rx="6" fill="#090d16" stroke="#1e293b"/>
    <text x="35" y="308" fill="#34d399" font-size="12" font-weight="bold">Result: 100% Context Retention &amp; Grounding</text>
    <text x="35" y="328" fill="#94a3b8" font-size="11">• Preserves long-range references without document duplication.</text>
    <text x="35" y="346" fill="#94a3b8" font-size="11">• Combines with Anthropic Contextual Retrieval for BM25 hybrid indexing.</text>
    <text x="35" y="362" fill="#34d399" font-size="10" font-weight="bold">Retrieval Accuracy: 94.2% (+35% vs Naive Fixed-Size)</text>
  </g>
</svg>
