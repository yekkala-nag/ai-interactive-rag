<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs><linearGradient id="vdbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#0e1a2e"/></linearGradient>
<linearGradient id="vdblu" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
<linearGradient id="vdgrn" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient></defs>
<rect width="1200" height="410" fill="url(#vdbg)" rx="12"/>
<text x="40" y="48" fill="#fff" font-size="24" font-weight="800">Vector-DB ops — RAM math first, recall measured on YOUR queries</text>
<text x="40" y="72" fill="#94a3b8" font-size="13">5M × 768 HNSW ≈ 20GB. Defaults lie — recall@k is workload-specific.</text>
<g font-size="12" font-weight="700">
<rect x="40" y="100" width="250" height="110" rx="10" fill="#0f172a" stroke="#475569" stroke-width="2"/><text x="56" y="128" fill="#fff">Flat · R 1.00</text><text x="56" y="150" fill="#e2e8f0" font-weight="400">brute force, low QPS</text><text x="56" y="170" fill="#e2e8f0" font-weight="400">RAM 1.0x · ≤100k</text><text x="56" y="194" fill="#64748b" font-weight="400">ground truth</text>
<rect x="310" y="100" width="250" height="110" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><text x="326" y="128" fill="#38bdf8">IVF · R 0.90–0.98</text><text x="326" y="150" fill="#e2e8f0" font-weight="400">nlist≈√N mid QPS</text><text x="326" y="170" fill="#e2e8f0" font-weight="400">RAM 1.1x · 1–10M</text><text x="326" y="194" fill="#64748b" font-weight="400">nprobe 8–64</text>
<rect x="580" y="100" width="250" height="110" rx="10" fill="url(#vdgrn)"/><text x="596" y="128" fill="#fff">HNSW · R 0.95–0.99</text><text x="596" y="150" fill="#d1fae5" font-weight="400">graph, high QPS</text><text x="596" y="170" fill="#d1fae5" font-weight="400">RAM 1.35x · &lt;50M</text><text x="596" y="194" fill="#fff" font-weight="400">default · M16 ef64–200</text>
<rect x="850" y="100" width="250" height="110" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/><text x="866" y="128" fill="#f59e0b">PQ · R 0.80–0.92</text><text x="866" y="150" fill="#e2e8f0" font-weight="400">compressed, high QPS</text><text x="866" y="170" fill="#e2e8f0" font-weight="400">RAM 0.15x · 100M+</text><text x="866" y="194" fill="#64748b" font-weight="400">pair w/ IVF/HNSW</text>
</g>
<rect x="40" y="230" width="560" height="70" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="256" fill="#fff" font-size="12" font-weight="700">Stores: Qdrant (filters+payloads, easy ops) · Milvus (huge partitions, GPU) · pgvector (≤2M, zero infra)</text>
<text x="60" y="278" fill="#94a3b8" font-size="11">Filters change everything — benchmark WITH payload filters, not pure ANN.</text>
<rect x="620" y="230" width="540" height="70" rx="10" fill="url(#vdblu)"/>
<text x="640" y="256" fill="#fff" font-size="12" font-weight="700">RAM rule: vectors × dim × 4B × index-mult</text>
<text x="640" y="278" fill="#e0f2fe" font-size="11">1M×768 float32 ≈ 3GB raw · HNSW ≈ 4GB.</text>
<rect x="40" y="320" width="1120" height="50" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="346" fill="#94a3b8" font-size="12">Simulator: vectors × dim × index → GB + guidance + recall warning.</text>
</svg>
