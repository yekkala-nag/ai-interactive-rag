<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs><linearGradient id="ftbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#0e1a2e"/></linearGradient>
<linearGradient id="ftblu" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
<linearGradient id="ftgrn" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient></defs>
<rect width="1200" height="380" fill="url(#ftbg)" rx="12"/>
<text x="40" y="48" fill="#fff" font-size="24" font-weight="800">functools: decorators that delete boilerplate</text>
<text x="40" y="72" fill="#94a3b8" font-size="13">total_ordering · partial · singledispatch (+lru_cache lineage). Neat — with caveats attached.</text>
<g font-size="12" font-weight="700">
<rect x="40" y="100" width="330" height="110" rx="10" fill="url(#ftblu)"/><text x="56" y="128" fill="#fff">@total_ordering</text><text x="56" y="150" fill="#e0f2fe" font-weight="400">__eq__ + one ordering → all 6</text><text x="56" y="170" fill="#e0f2fe" font-weight="400">14 lines → 6</text><text x="56" y="194" fill="#fff" font-weight="400">⚠ derives = slow hot paths</text>
<rect x="390" y="100" width="330" height="110" rx="10" fill="url(#ftblu)"/><text x="406" y="128" fill="#fff">partial(fn, …)</text><text x="406" y="150" fill="#e0f2fe" font-weight="400">freeze leading args</text><text x="406" y="170" fill="#e0f2fe" font-weight="400">8 lines → 2</text><text x="406" y="194" fill="#fff" font-weight="400">⚠ name intent, tracebacks lie</text>
<rect x="740" y="100" width="420" height="110" rx="10" fill="url(#ftgrn)"/><text x="756" y="128" fill="#fff">@singledispatch + @register</text><text x="756" y="150" fill="#d1fae5" font-weight="400">type-routed overloads, no if-chains</text><text x="756" y="170" fill="#d1fae5" font-weight="400">12 lines → 7</text><text x="756" y="194" fill="#fff" font-weight="400">⚠ first-arg type only · hash args for lru</text>
</g>
<rect x="40" y="230" width="1120" height="110" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="256" fill="#fff" font-size="12" font-weight="800">Simulator: toggle tricks → lines before/after + caveat board. ~60% fewer lines, zero new dependencies.</text>
<text x="60" y="278" fill="#94a3b8" font-size="11">Rule: stdlib first. from functools import * in articles; import names explicitly in production.</text>
<text x="60" y="300" fill="#64748b" font-size="11">C. Tao, TDS · lru_cache covered in lineage — recursion + web-call memoization for free.</text>
<text x="60" y="322" fill="#94a3b8" font-size="11">Readability is the feature. The line count is just how you notice it.</text>
</svg>
