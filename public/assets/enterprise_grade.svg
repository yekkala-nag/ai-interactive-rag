<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs><linearGradient id="egbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#101a30"/></linearGradient>
<linearGradient id="eggrn" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient></defs>
<rect width="1200" height="420" fill="url(#egbg)" rx="12"/>
<text x="40" y="48" fill="#fff" font-size="24" font-weight="800">Enterprise-grade = end-to-end, not best-metric</text>
<text x="40" y="72" fill="#94a3b8" font-size="13">Mundane beats moonshots. 87% never reach production. Good-enough + monitored beats perfect + dead.</text>
<g font-size="12" font-weight="700">
<rect x="40" y="100" width="250" height="100" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><text x="56" y="128" fill="#38bdf8">Data diligence</text><text x="56" y="150" fill="#e2e8f0" font-weight="400">6 checks: target·time</text><text x="56" y="170" fill="#e2e8f0" font-weight="400">gaps·season·SME·external</text><text x="56" y="190" fill="#64748b" font-weight="400">leakage kills silently</text>
<rect x="310" y="100" width="250" height="100" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="2"/><text x="326" y="128" fill="#ef4444">Bias traps</text><text x="326" y="150" fill="#e2e8f0" font-weight="400">COMPAS · Apple Card</text><text x="326" y="170" fill="#e2e8f0" font-weight="400">suppression fallacy</text><text x="326" y="190" fill="#64748b" font-weight="400">test in, test out</text>
<rect x="580" y="100" width="250" height="100" rx="10" fill="url(#eggrn)"/><text x="596" y="128" fill="#fff">Good-enough</text><text x="596" y="150" fill="#d1fae5" font-weight="400">benchmark, not best</text><text x="596" y="170" fill="#d1fae5" font-weight="400">4 deploy questions</text><text x="596" y="190" fill="#fff" font-weight="400">10–20% edge compounds</text>
<rect x="850" y="100" width="250" height="100" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/><text x="866" y="128" fill="#f59e0b">MLOps watch</text><text x="866" y="150" fill="#e2e8f0" font-weight="400">integrity·health·drift×4</text><text x="866" y="170" fill="#e2e8f0" font-weight="400">label-free canaries</text><text x="866" y="190" fill="#64748b" font-weight="400">root-cause speed = KPI</text>
</g>
<rect x="40" y="220" width="1120" height="60" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="244" fill="#fff" font-size="12" font-weight="700">Drifts: concept (you caused it) · label (world moved) · feature (inputs moved) · prediction (output moved)</text>
<text x="60" y="266" fill="#94a3b8" font-size="11">Ground truth arrives late — label-free signals carry the near term.</text>
<rect x="40" y="300" width="720" height="80" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="326" fill="#fff" font-size="12" font-weight="700">Buy-in: XAI for trust · realistic 10–20% · culture from the top</text>
<text x="60" y="348" fill="#94a3b8" font-size="11">Mistrust + hype promises kill programs faster than bad models.</text>
<rect x="780" y="300" width="380" height="80" rx="10" fill="url(#eggrn)"/>
<text x="800" y="326" fill="#fff" font-size="12" font-weight="800">Readiness simulator below</text>
<text x="800" y="348" fill="#d1fae5" font-size="11">6 toggles → score + first fix. 85 ship · 60 gaps · else not-yet.</text>
</svg>
