<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="tbbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#0e1a2e"/>
    </linearGradient>
    <linearGradient id="tbred" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="tbgrn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="tbblu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="tbamb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <marker id="tbarr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 Z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="1200" height="580" fill="url(#tbbg)" rx="12"/>
  <text x="40" y="48" fill="#fff" font-size="24" font-weight="800">Don't flatten the grid — diagnostic + composable ops keep tables as data</text>
  <text x="40" y="72" fill="#94a3b8" font-size="13">PDF table = rectangles + positioned text. Restore the grid early; flattening destroys row × column answers.</text>

  <rect x="40" y="100" width="340" height="170" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
  <text x="60" y="128" fill="#ef4444" font-size="14" font-weight="800">✕ Flattened → intersection lost</text>
  <g font-size="11" fill="#cbd5e1">
    <text x="60" y="152">label lands here … value lands there</text>
    <text x="60" y="170">header only on page 1 → pp.2+ = noise</text>
    <text x="60" y="188">no "row 47" → line-citation breaks</text>
  </g>
  <g font-size="10" font-family="monospace">
    <rect x="60" y="200" width="300" height="22" rx="4" fill="#1e293b"/><text x="70" y="215" fill="#64748b">wheat … 41.2 … 44.8 … ??? which row?</text>
    <rect x="60" y="226" width="300" height="22" rx="4" fill="#1e293b"/><text x="70" y="241" fill="#64748b">… 2027f values with no commodity</text>
  </g>

  <rect x="400" y="100" width="380" height="170" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="420" y="128" fill="#38bdf8" font-size="14" font-weight="800"> diagnostic table_df_meta (per table)</text>
  <g font-size="11">
    <text x="420" y="150" fill="#e2e8f0">parse: perfect / partial / failed</text>
    <text x="420" y="168" fill="#e2e8f0">size: (rows, cols) vs context budget</text>
    <text x="420" y="186" fill="#e2e8f0">header: present / absent / continuation</text>
    <text x="420" y="204" fill="#e2e8f0">pages: autonomous / from-N / to-M</text>
    <text x="420" y="222" fill="#e2e8f0">doc ratio: 6% · 13% · 26% → ~50% = SQL</text>
    <text x="420" y="248" fill="#64748b" font-size="10">orthogonal — a table can be all hard at once</text>
  </g>

  <rect x="800" y="100" width="360" height="170" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="820" y="128" fill="#10b981" font-size="14" font-weight="800">✓ Grid kept → 4 levels</text>
  <g font-size="11">
    <text x="820" y="150" fill="#e2e8f0">A · row-as-line (Markdown, bbox kept)</text>
    <text x="820" y="168" fill="#e2e8f0">B · table_df (columns addressable)</text>
    <text x="820" y="186" fill="#e2e8f0">C · typed columns → SQL corpus</text>
    <text x="820" y="204" fill="#94a3b8">D · heterogeneous fallback (honest)</text>
    <text x="820" y="230" fill="#64748b" font-size="10">most stay A · few → B · recurring → C</text>
  </g>

  <text x="40" y="300" fill="#fff" font-size="14" font-weight="800">Five composable, idempotent ops (dispatcher composes, e.g. O1→O2→O3)</text>
  <g font-size="11" font-weight="700">
    <rect x="40" y="312" width="210" height="64" rx="8" fill="url(#tbblu)"/><text x="52" y="334" fill="#fff">O1 · rebuild grid</text><text x="52" y="352" fill="#e0f2fe" font-weight="400">x/y clustering · ~free</text>
    <rect x="262" y="312" width="210" height="64" rx="8" fill="url(#tbblu)"/><text x="274" y="334" fill="#fff">O2 · concat + header</text><text x="274" y="352" fill="#e0f2fe" font-weight="400">+ source_page</text>
    <rect x="484" y="312" width="210" height="64" rx="8" fill="url(#tbamb)"/><text x="496" y="334" fill="#fff">O3 · project/filter</text><text x="496" y="352" fill="#ffedd5" font-weight="400">from question scope</text>
    <rect x="706" y="312" width="210" height="64" rx="8" fill="url(#tbgrn)"/><text x="718" y="334" fill="#fff">O4 · lift to SQL (B→C/D)</text><text x="718" y="352" fill="#d1fae5" font-weight="400">named + typed cols</text>
    <rect x="928" y="312" width="210" height="64" rx="8" fill="url(#tbred)"/><text x="940" y="334" fill="#fff">O5 · vision fallback</text><text x="940" y="352" fill="#fecaca" font-weight="400">≥10x · last resort</text>
  </g>

  <rect x="40" y="392" width="720" height="150" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="60" y="420" fill="#fff" font-size="14" font-weight="800">Evidence: parser choice ≥ op choice</text>
  <text x="60" y="442" fill="#e2e8f0" font-size="12">Attention Table-3 (13 cols): Fitz → 3 cells (failed) · Azure DI → 13 cols (perfect).</text>
  <text x="60" y="462" fill="#e2e8f0" font-size="12">NIST Core: O1 folds 8→4 cols, O2 forward-fills Function/Category across ~20 pp.</text>
  <text x="60" y="482" fill="#e2e8f0" font-size="12">CMO p17 (42×14): O1 recovers Commodity labels, O3 projects (wheat, 2027).</text>
  <text x="60" y="522" fill="#64748b" font-size="11">Start cheap, escalate hard tables/pages (Art.10 cascade). Audit = diagnostic + ops + table_df.</text>

  <rect x="780" y="392" width="380" height="150" rx="10" fill="#0f172a" stroke="#c9a84c"/>
  <text x="800" y="420" fill="#c9a84c" font-size="14" font-weight="800">Question modulates answer</text>
  <text x="800" y="442" fill="#e2e8f0" font-size="12">cell → 1 value + rect citation</text>
  <text x="800" y="462" fill="#e2e8f0" font-size="12">column → markdown slice + table cite</text>
  <text x="800" y="482" fill="#e2e8f0" font-size="12">aggregate → SQL agent, no retrieval</text>
  <text x="800" y="522" fill="#64748b" font-size="11">Kezhan Shi, TDS B4 · EDI series</text>
</svg>
