<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs><linearGradient id="lcbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#0e1a2e"/></linearGradient>
<linearGradient id="lcgrn" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
<linearGradient id="lcamb" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
<linearGradient id="lcred" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/></linearGradient></defs>
<rect width="1200" height="460" fill="url(#lcbg)" rx="12"/>
<text x="40" y="48" fill="#fff" font-size="24" font-weight="800">Long context — lost in the middle + stuff vs retrieve-then-read</text>
<text x="40" y="72" fill="#94a3b8" font-size="13">Recall is U-shaped: head/tail strong, 20–80% weak. Anchors head AND tail; compress the rest.</text>
<rect x="40" y="100" width="700" height="120" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="128" fill="#94a3b8" font-size="12">position → recall</text>
<line x1="70" y1="190" x2="710" y2="190" stroke="#475569" stroke-width="2"/>
<path d="M80,130 C 200,130 240,185 390,188 C 540,191 580,130 700,130" stroke="#ef4444" stroke-width="3" fill="none"/>
<text x="80" y="210" fill="#10b981" font-size="11">head: strong</text><text x="340" y="210" fill="#ef4444" font-size="11">middle 20–80%: −30% recall</text><text x="600" y="210" fill="#10b981" font-size="11">tail: strong</text>
<rect x="760" y="100" width="400" height="120" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
<text x="780" y="128" fill="#f59e0b" font-size="14" font-weight="800">Fix: anchor twice</text>
<text x="780" y="150" fill="#e2e8f0" font-size="12">query + instructions at head AND tail</text>
<text x="780" y="170" fill="#e2e8f0" font-size="12">re-assert constraints before generation</text>
<text x="780" y="198" fill="#64748b" font-size="11">retrieve-then-read when overflow</text>
<g font-size="11" font-weight="700">
<rect x="40" y="240" width="250" height="70" rx="8" fill="#0f172a" stroke="#38bdf8"/><text x="56" y="264" fill="#fff">L0 verbatim 1x</text><text x="56" y="284" fill="#94a3b8" font-weight="400">citations · legal spans</text>
<rect x="310" y="240" width="250" height="70" rx="8" fill="#0f172a" stroke="#38bdf8"/><text x="326" y="264" fill="#fff">L1 extractive 3–5x</text><text x="326" y="284" fill="#94a3b8" font-weight="400">key sentences + pointers</text>
<rect x="580" y="240" width="250" height="70" rx="8" fill="url(#lcamb)"/><text x="596" y="264" fill="#fff">L2 summary 10–20x</text><text x="596" y="284" fill="#ffedd5" font-weight="400">verify entities kept</text>
<rect x="850" y="240" width="250" height="70" rx="8" fill="url(#lcgrn)"/><text x="866" y="264" fill="#fff">L3 state 30–50x</text><text x="866" y="284" fill="#d1fae5" font-weight="400">slots/decisions JSON</text>
</g>
<rect x="40" y="330" width="1120" height="90" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="358" fill="#fff" font-size="13" font-weight="800">Planner rule: fits + edge needle → stuff · fits + mid needle → stuff + double anchors · overflow → retrieve-then-read</text>
<text x="60" y="382" fill="#94a3b8" font-size="12">Instruction drift: long docs wash out constraints → compact block at tail. Stale memory: compact with tombstones.</text>
<text x="60" y="404" fill="#64748b" font-size="11">Use the simulator: set doc size, window, needle depth → get the strategy + overflow math.</text>
</svg>
