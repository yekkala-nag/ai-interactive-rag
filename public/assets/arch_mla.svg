<text x="170" y="265" font-family="Syne, sans-serif" font-size="Latent C_KV" font-weight="800" fill="#2a8a84" text-anchor="middle">Latent C_KV</text>
<text x="170" y="285" font-family="Syne, sans-serif" font-size="d_c ≪ d  ✅ tiny" font-weight="700" fill="#2a8a84" text-anchor="middle">d_c ≪ d  ✅ tiny</text>
<line x1="270" y1="265" x2="470" y2="265" stroke="#2a8a84" stroke-width="2.5" marker-end="url(#ah2)"/>
