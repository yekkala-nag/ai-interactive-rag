<text x="170" y="150" font-family="Syne, sans-serif" font-size="cache K,V per head" font-weight="600" fill="#6a6a7a" text-anchor="middle">cache K,V per head</text>
<text x="170" y="170" font-family="Syne, sans-serif" font-size="O(n·h·d)  ❌ big" font-weight="700" fill="#c4572a" text-anchor="middle">O(n·h·d)  ❌ big</text>
<line x1="170" y1="170" x2="170" y2="230" stroke="#2a8a84" stroke-width="2.5"/>
