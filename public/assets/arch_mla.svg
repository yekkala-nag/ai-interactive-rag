<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" font-family="Syne, sans-serif">
<rect width="1100" height="360" fill="#f7f5f0"/>
<text x="550" y="40" font-family="Syne, sans-serif" font-size="Multi-Head Latent Attention — Compress the KV Cache" font-weight="800" fill="#2a8a84" text-anchor="middle">Multi-Head Latent Attention — Compress the KV Cache</text>
