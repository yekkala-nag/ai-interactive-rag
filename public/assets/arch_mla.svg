<text x="580" y="265" font-family="Syne, sans-serif" font-size="Up-project → K,V" font-weight="800" fill="#2a8a84" text-anchor="middle">Up-project → K,V</text>
<text x="580" y="285" font-family="Syne, sans-serif" font-size="C_KV · W_UK, W_UV" font-weight="600" fill="#6a6a7a" text-anchor="middle">C_KV · W_UK, W_UV</text>
<defs><marker id="ah2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2a8a84"/></marker></defs>
<text x="550" y="330" font-family="Syne, sans-serif" font-size="Cache a small latent once; recompute K & V on demand → 2.7–4.7× less memory, zero quality loss." font-weight="600" fill="#6a6a7a" text-anchor="middle">Cache a small latent once; recompute K & V on demand → 2.7–4.7× less memory, zero quality loss.</text>
