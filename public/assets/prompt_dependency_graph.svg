<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="dgbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#101a30"/>
    </linearGradient>
    <linearGradient id="dgorg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb923c"/><stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="dggray" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/><stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="dgred" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="dgcyn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <marker id="dgarr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 Z" fill="#38bdf8"/></marker>
    <marker id="dgarro" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 Z" fill="#fb923c"/></marker>
  </defs>
  <rect width="1200" height="560" fill="url(#dgbg)" rx="12"/>
  <text x="40" y="48" fill="#fff" font-size="24" font-weight="800">One prompt change → reachable ceiling vs candidate eval set</text>
  <text x="40" y="72" fill="#94a3b8" font-size="13">Same BFS twice: once from the component (reachable), once from the changed section + downstream (candidate).</text>

  <rect x="40" y="100" width="220" height="120" rx="10" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
  <text x="56" y="128" fill="#fecaca" font-size="13" font-weight="800">◉ base-policy v1→v2</text>
  <text x="56" y="148" fill="#fff" font-size="12">refunds: 30d → 14d ✎</text>
  <text x="56" y="166" fill="#94a3b8" font-size="11">privacy: unchanged</text>
  <text x="56" y="184" fill="#94a3b8" font-size="11">escalation: unchanged</text>
  <text x="56" y="204" fill="#fca5a5" font-size="11">changed_sections() = [refunds]</text>

  <g font-size="11" font-weight="700">
    <rect x="330" y="100" width="180" height="56" rx="8" fill="url(#dgorg)"/><text x="344" y="123" fill="#fff">support-* (refunds+privacy)</text><text x="344" y="141" fill="#ffedd5" font-weight="400">CANDIDATE · orange</text>
    <rect x="330" y="164" width="180" height="56" rx="8" fill="url(#dgorg)"/><text x="344" y="187" fill="#fff">ops-* (refunds+esc.)</text><text x="344" y="205" fill="#ffedd5" font-weight="400">CANDIDATE · orange</text>
    <rect x="540" y="100" width="180" height="56" rx="8" fill="url(#dggray)"/><text x="554" y="123" fill="#fff">sales-* (privacy only)</text><text x="554" y="141" fill="#e2e8f0" font-weight="400">reachable, NOT candidate</text>
    <rect x="540" y="164" width="180" height="56" rx="8" fill="url(#dggray)"/><text x="554" y="187" fill="#fff">analyst (escalation)</text><text x="554" y="205" fill="#e2e8f0" font-weight="400">reachable, NOT candidate</text>
    <rect x="750" y="100" width="180" height="56" rx="8" fill="#0f172a" stroke="#10b981"/><text x="764" y="123" fill="#10b981">marketing-*</text><text x="764" y="141" fill="#94a3b8" font-weight="400">not reachable (10 nodes)</text>
    <rect x="750" y="164" width="180" height="56" rx="8" fill="url(#dgorg)"/><text x="764" y="187" fill="#fff">refund-workflow</text><text x="764" y="205" fill="#ffedd5" font-weight="400">via members → candidate</text>
  </g>
  <g stroke="#38bdf8" stroke-width="2" marker-end="url(#dgarr)">
    <line x1="260" y1="140" x2="328" y2="128"/><line x1="260" y1="170" x2="328" y2="192"/><line x1="260" y1="185" x2="538" y2="128"/><line x1="260" y1="195" x2="538" y2="192"/>
  </g>
  <g stroke="#fb923c" stroke-width="2" marker-end="url(#dgarro)">
    <line x1="510" y1="128" x2="748" y2="180"/><line x1="510" y1="192" x2="748" y2="190"/>
  </g>

  <rect x="40" y="245" width="360" height="130" rx="10" fill="#0f172a" stroke="#ef4444"/>
  <text x="60" y="273" fill="#ef4444" font-size="14" font-weight="800">REACHABLE = 45 (ceiling)</text>
  <text x="60" y="295" fill="#e2e8f0" font-size="12">every node downstream of base-policy</text>
  <text x="60" y="315" fill="#e2e8f0" font-size="12">for ANY reason (any section)</text>
  <text x="60" y="355" fill="#64748b" font-size="11">flat lookup finds 1 hop · BFS finds all 4+</text>

  <rect x="420" y="245" width="360" height="130" rx="10" fill="#0f172a" stroke="#fb923c"/>
  <text x="440" y="273" fill="#fb923c" font-size="14" font-weight="800">CANDIDATE = 24 (eval set)</text>
  <text x="440" y="295" fill="#e2e8f0" font-size="12">declared refunds ↓ + downstream</text>
  <text x="440" y="315" fill="#e2e8f0" font-size="12">21 reachable-but-not-candidate skipped</text>
  <text x="440" y="355" fill="#10b981" font-size="11">narrowing = 47% on this change</text>

  <rect x="800" y="245" width="360" height="130" rx="10" fill="#0f172a" stroke="#475569"/>
  <text x="820" y="273" fill="#fff" font-size="14" font-weight="800">Honest case: tone → 55/55</text>
  <text x="820" y="295" fill="#e2e8f0" font-size="12">universal component → no shortcut</text>
  <text x="820" y="315" fill="#e2e8f0" font-size="12">tool reports 55, no apology</text>
  <text x="820" y="355" fill="#94a3b8" font-size="11">narrowing 0% is a valid answer</text>

  <rect x="40" y="395" width="1120" height="125" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="60" y="423" fill="#fff" font-size="14" font-weight="800">Sharing-level curve (synthetic 55-node, seed 7): selective sharing → big narrowing</text>
  <g font-size="11" font-weight="700">
    <rect x="60" y="436" width="180" height="60" rx="6" fill="url(#dgcyn)"/><text x="72" y="458" fill="#fff">10% shared → 85%</text><text x="72" y="477" fill="#e0f2fe" font-weight="400">54 reach · 8 cand</text>
    <rect x="260" y="436" width="180" height="60" rx="6" fill="url(#dgcyn)"/><text x="272" y="458" fill="#fff">24% shared → 72%</text><text x="272" y="477" fill="#e0f2fe" font-weight="400">54 reach · 15 cand</text>
    <rect x="460" y="436" width="180" height="60" rx="6" fill="url(#dgorg)"/><text x="472" y="458" fill="#fff">50% shared → 46%</text><text x="472" y="477" fill="#ffedd5" font-weight="400">54 reach · 29 cand</text>
    <rect x="660" y="436" width="180" height="60" rx="6" fill="#1e293b" stroke="#475569"/><text x="672" y="458" fill="#cbd5e1">76% shared → 20%</text><text x="672" y="477" fill="#94a3b8" font-weight="400">54 reach · 43 cand</text>
    <rect x="860" y="436" width="180" height="60" rx="6" fill="url(#dgred)"/><text x="872" y="458" fill="#fff">100% tone → 0%</text><text x="872" y="477" fill="#fecaca" font-weight="400">55 reach · 55 cand</text>
  </g>
  <text x="1060" y="508" fill="#64748b" font-size="10">Emmimal Alexander, TDS</text>
</svg>
