<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs><linearGradient id="aebg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#101a30"/></linearGradient>
<linearGradient id="aegr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
<linearGradient id="aeam" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
<linearGradient id="aerd" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/></linearGradient></defs>
<rect width="1200" height="420" fill="url(#aebg)" rx="12"/>
<text x="40" y="48" fill="#fff" font-size="24" font-weight="800">Agent evals — pass^k punishes flakiness, red-team probes malice</text>
<text x="40" y="72" fill="#94a3b8" font-size="13">p=0.8 looks fine; pass^3=0.51 ships flaky. 4 attacks: injection · exfil · drift · jailbreak.</text>
<g font-size="12" font-weight="700">
<rect x="40" y="100" width="520" height="110" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><text x="56" y="128" fill="#38bdf8">τ-style task battery</text><text x="56" y="150" fill="#e2e8f0" font-weight="400">refund lookup · tool-order repair · contradiction refusal</text><text x="56" y="170" fill="#e2e8f0" font-weight="400">metric: pass^k — ALL k runs must pass</text><text x="56" y="194" fill="#64748b" font-weight="400">+ success-per-dollar (budget tasks)</text>
<rect x="580" y="100" width="580" height="110" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="2"/><text x="596" y="128" fill="#ef4444">Red-team battery (4)</text><text x="596" y="150" fill="#e2e8f0" font-weight="400">indirect injection · exfil steer · goal drift · jailbreak</text><text x="596" y="170" fill="#e2e8f0" font-weight="400">defences: hierarchy · brokered creds · scope caps</text><text x="596" y="194" fill="#64748b" font-weight="400">detect: canaries · secret alerts · audit diffs</text>
</g>
<g font-size="12" font-weight="700">
<rect x="40" y="230" width="340" height="60" rx="8" fill="url(#aegr)"/><text x="56" y="255" fill="#fff">SHIP · pass^k≥0.7 + sec≥0.9</text>
<rect x="400" y="230" width="340" height="60" rx="8" fill="url(#aeam)"/><text x="416" y="255" fill="#fff">GATE · pass^k≥0.5 + sec≥0.75</text>
<rect x="760" y="230" width="400" height="60" rx="8" fill="url(#aerd)"/><text x="776" y="255" fill="#fff">REBUILD · else (flaky or porous)</text>
</g>
<rect x="40" y="310" width="1120" height="70" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="336" fill="#fff" font-size="12" font-weight="700">Simulator: single-run p × k + blocked/total attacks → pass^k, security rate, verdict.</text>
<text x="60" y="358" fill="#94a3b8" font-size="11">Flaky-but-secure gates on planner caps; secure-but-porous rebuilds on hardening drills.</text>
</svg>
