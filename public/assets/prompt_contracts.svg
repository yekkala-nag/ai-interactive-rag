<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs><linearGradient id="pcbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#101a30"/></linearGradient>
<linearGradient id="pcgrn" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
<linearGradient id="pcred" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/></linearGradient></defs>
<rect width="1200" height="430" fill="url(#pcbg)" rx="12"/>
<text x="40" y="48" fill="#fff" font-size="24" font-weight="800">Prompt contracts — versioned sections + pins + schemas gate change</text>
<text x="40" y="72" fill="#94a3b8" font-size="13">Dependency graph says WHAT to retest. Contracts say whether the change may ship at all.</text>
<g font-size="12" font-weight="700">
<rect x="40" y="100" width="250" height="110" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><text x="56" y="128" fill="#38bdf8">📜 Section manifest</text><text x="56" y="150" fill="#e2e8f0" font-weight="400">named sections declared</text><text x="56" y="170" fill="#e2e8f0" font-weight="400">unknown rejected</text><text x="56" y="194" fill="#64748b" font-weight="400">rename needs alias</text>
<rect x="310" y="100" width="250" height="110" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><text x="326" y="128" fill="#38bdf8">📌 Version pin</text><text x="326" y="150" fill="#e2e8f0" font-weight="400">agent pins comp@ver</text><text x="326" y="170" fill="#e2e8f0" font-weight="400">floating fails CI</text><text x="326" y="194" fill="#64748b" font-weight="400">no silent upgrades</text>
<rect x="580" y="100" width="250" height="110" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><text x="596" y="128" fill="#38bdf8">🧾 I/O schema</text><text x="596" y="150" fill="#e2e8f0" font-weight="400">JSON both sides</text><text x="596" y="170" fill="#e2e8f0" font-weight="400">new required = major</text><text x="596" y="194" fill="#64748b" font-weight="400">validate in/out</text>
<rect x="850" y="100" width="250" height="110" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="2"/><text x="866" y="128" fill="#ef4444">🛡 Capability flags</text><text x="866" y="150" fill="#e2e8f0" font-weight="400">tools/data declared</text><text x="866" y="170" fill="#e2e8f0" font-weight="400">overreach blocked</text><text x="866" y="194" fill="#64748b" font-weight="400">widen = sec review</text>
</g>
<rect x="40" y="230" width="560" height="80" rx="10" fill="url(#pcgrn)"/>
<text x="60" y="258" fill="#fff" font-size="13" font-weight="800">✓ Compatible: reword same intent · add optional section → auto-pass + sample eval</text>
<text x="60" y="282" fill="#d1fae5" font-size="12">Cheap changes stay cheap. Graph narrows the sample set.</text>
<rect x="620" y="230" width="540" height="80" rx="10" fill="url(#pcred)"/>
<text x="640" y="258" fill="#fff" font-size="13" font-weight="800">✕ Breaking: rename w/o alias · schema change · wider caps → BLOCK</text>
<text x="640" y="282" fill="#fecaca" font-size="12">Require alias + major bump + candidate re-eval.</text>
<rect x="40" y="330" width="1120" height="60" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="356" fill="#94a3b8" font-size="12">Pipeline order: contract gate (may it ship?) → dependency graph (what to retest?) → golden regression (did behaviour hold?). Simulator below.</text>
</svg>
