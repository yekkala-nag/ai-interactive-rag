<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs><linearGradient id="aebg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#0e1a2e"/></linearGradient>
<linearGradient id="aeblu" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient></defs>
<rect width="1200" height="400" fill="url(#aebg)" rx="12"/>
<text x="40" y="48" fill="#fff" font-size="24" font-weight="800">Amplify the expert — scale judgment, don't replace it</text>
<text x="40" y="72" fill="#94a3b8" font-size="13">Ctrl+F + TOC that experts trust, scaled by LLM. Opaque vectors lose trust; unused systems value zero.</text>
<rect x="40" y="100" width="520" height="90" rx="10" fill="#0f172a" stroke="#475569" stroke-width="2"/>
<text x="60" y="126" fill="#94a3b8" font-size="12" font-weight="800">IT camp: opaque pipeline nobody can explain</text>
<text x="60" y="148" fill="#e2e8f0" font-size="12">chunk → embed → cosine → trust me</text>
<text x="60" y="168" fill="#64748b" font-size="11">ML-decade rerun: 85% failed the same way</text>
<rect x="580" y="100" width="580" height="90" rx="10" fill="url(#aeblu)"/>
<text x="600" y="126" fill="#fff" font-size="12" font-weight="800">Bridge: expert method at machine scale ✓</text>
<text x="600" y="148" fill="#e0f2fe" font-size="12">keywords → TOC → line-cited answers, deterministic dispatch</text>
<text x="600" y="168" fill="#fff" font-size="11">auditable · reproducible · pyramids a hire traces in one sitting</text>
<g font-size="11" font-weight="700">
<rect x="40" y="210" width="250" height="60" rx="8" fill="#0f172a" stroke="#38bdf8"/><text x="56" y="232" fill="#fff">vectors = fallback</text><text x="56" y="252" fill="#94a3b8" font-weight="400">dictionary missed an alias</text>
<rect x="310" y="210" width="250" height="60" rx="8" fill="#0f172a" stroke="#38bdf8"/><text x="326" y="232" fill="#fff">tables at junctions</text><text x="326" y="252" fill="#94a3b8" font-weight="400">line_df · toc_df · briefs</text>
<rect x="580" y="210" width="250" height="60" rx="8" fill="#0f172a" stroke="#38bdf8"/><text x="596" y="232" fill="#fff">4 bricks mirror experts</text><text x="596" y="252" fill="#94a3b8" font-weight="400">scan · Ctrl-F · triage · restate</text>
<rect x="850" y="210" width="250" height="60" rx="8" fill="#0f172a" stroke="#38bdf8"/><text x="866" y="232" fill="#fff">6 positions follow</text><text x="866" y="252" fill="#94a3b8" font-weight="400">one thesis, six consequences</text>
</g>
<rect x="40" y="290" width="1120" height="70" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="314" fill="#fff" font-size="12" font-weight="700">Applies iff: known docs · reachable experts · amplification goal · audit required — else go general.</text>
<text x="60" y="336" fill="#94a3b8" font-size="11">Simulator: toggle the four conditions → verdict. Strong exactly because it admits its boundary.</text>
</svg>
