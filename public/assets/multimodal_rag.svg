<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs><linearGradient id="mmbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#0e1a2e"/></linearGradient>
<linearGradient id="mmblu" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient></defs>
<rect width="1200" height="400" fill="url(#mmbg)" rx="12"/>
<text x="40" y="48" fill="#fff" font-size="24" font-weight="800">Multimodal RAG — every pixel cites geometry</text>
<text x="40" y="72" fill="#94a3b8" font-size="13">Route per page: OCR+layout · table grid · DePlot charts · SigLIP+VQA photos. Vision share &gt;30% = budget vision LLM.</text>
<g font-size="12" font-weight="700">
<rect x="40" y="100" width="250" height="100" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><text x="56" y="128" fill="#38bdf8">Scans → OCR+layout</text><text x="56" y="150" fill="#e2e8f0" font-weight="400">DocLayNet + conf</text><text x="56" y="170" fill="#e2e8f0" font-weight="400">cite page bbox</text><text x="56" y="190" fill="#64748b" font-weight="400">order ≠ reading</text>
<rect x="310" y="100" width="250" height="100" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><text x="326" y="128" fill="#38bdf8">Tables → grid</text><text x="326" y="150" fill="#e2e8f0" font-weight="400">Table Transformer</text><text x="326" y="170" fill="#e2e8f0" font-weight="400">cite row/cell rect</text><text x="326" y="190" fill="#64748b" font-weight="400">merged cells bite</text>
<rect x="580" y="100" width="250" height="100" rx="10" fill="url(#mmblu)"/><text x="596" y="128" fill="#fff">Charts → DePlot</text><text x="596" y="150" fill="#e0f2fe" font-weight="400">plot → data table</text><text x="596" y="170" fill="#e0f2fe" font-weight="400">then SQL/text path</text><text x="596" y="190" fill="#fff" font-weight="400">hue/size → VLM</text>
<rect x="850" y="100" width="250" height="100" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/><text x="866" y="128" fill="#f59e0b">Photos → VQA</text><text x="866" y="150" fill="#e2e8f0" font-weight="400">SigLIP + LLaVA</text><text x="866" y="170" fill="#e2e8f0" font-weight="400">cite image region</text><text x="866" y="190" fill="#64748b" font-weight="400">captions hallucinate</text>
</g>
<rect x="40" y="220" width="560" height="70" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="246" fill="#fff" font-size="12" font-weight="700">Retrieval: SigLIP/CLIP bi-encoder → VQA rerank. Numbers always verified.</text>
<text x="60" y="268" fill="#94a3b8" font-size="11">Caption detail without verification is a hallucination with coordinates.</text>
<rect x="620" y="220" width="540" height="70" rx="10" fill="#0f172a" stroke="#c9a84c"/>
<text x="640" y="246" fill="#c9a84c" font-size="12" font-weight="800">Citation invariant</text>
<text x="640" y="268" fill="#e2e8f0" font-size="11">No naked claims: bbox · rect · figure · recovered table — always geometry.</text>
<rect x="40" y="310" width="1120" height="50" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="336" fill="#94a3b8" font-size="12">Simulator: page-mix sliders → pipeline, vision-LLM verdict, citation rule.</text>
</svg>
