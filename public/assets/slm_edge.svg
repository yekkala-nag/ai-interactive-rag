<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs><linearGradient id="slbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#0e1a2e"/></linearGradient>
<linearGradient id="slgrn" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient></defs>
<rect width="1200" height="400" fill="url(#slbg)" rx="12"/>
<text x="40" y="48" fill="#fff" font-size="24" font-weight="800">Edge SLMs — distill, quantize, parity-gate, fit the device</text>
<text x="40" y="72" fill="#94a3b8" font-size="13">Fit rule: model ≤ 60% of device RAM. Local SLM routes/classifies; cloud verifies.</text>
<g font-size="12" font-weight="700">
<rect x="40" y="100" width="330" height="100" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><text x="56" y="128" fill="#38bdf8">Distill: KD · SeqKD</text><text x="56" y="150" fill="#e2e8f0" font-weight="400">soft targets / teacher gens</text><text x="56" y="170" fill="#e2e8f0" font-weight="400">~90% quality @10% size</text><text x="56" y="190" fill="#64748b" font-weight="400">+ speculative draft 2–3x</text>
<rect x="390" y="100" width="330" height="100" rx="10" fill="url(#slgrn)"/><text x="406" y="128" fill="#fff">SLMs: Phi-mini · SmolLM2</text><text x="406" y="150" fill="#d1fae5" font-weight="400">Qwen-small · 1–4B Q4</text><text x="406" y="170" fill="#d1fae5" font-weight="400">1–5GB · 8–30 tok/s</text><text x="406" y="190" fill="#fff" font-weight="400">RAG reader · router</text>
<rect x="740" y="100" width="420" height="100" rx="10" fill="#0f172a" stroke="#c9a84c" stroke-width="2"/><text x="756" y="128" fill="#c9a84c">Parity gate (non-negotiable)</text><text x="756" y="150" fill="#e2e8f0" font-weight="400">edge SLM passes server golden set</text><text x="756" y="170" fill="#e2e8f0" font-weight="400">same evals, smaller body</text><text x="756" y="190" fill="#64748b" font-weight="400">fail → distill again</text>
</g>
<rect x="40" y="220" width="560" height="70" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="246" fill="#fff" font-size="12" font-weight="700">Split pattern: local classify/route → cloud verify/draft-speculate</text>
<text x="60" y="268" fill="#94a3b8" font-size="11">Privacy + offline + latency win locally; quality escrow in cloud.</text>
<rect x="620" y="220" width="540" height="70" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
<text x="640" y="246" fill="#ef4444" font-size="12" font-weight="800">Anti-pattern: silent edge downgrade</text>
<text x="640" y="268" fill="#e2e8f0" font-size="11">Different model = different evals. Version and gate it like any deploy.</text>
<rect x="40" y="310" width="1120" height="50" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="336" fill="#94a3b8" font-size="12">Simulator: params × bits × RAM × tok/s need → fit verdict + pattern.</text>
</svg>
