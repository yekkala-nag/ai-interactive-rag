<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs><linearGradient id="plbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#101a30"/></linearGradient>
<linearGradient id="plgrn" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
<linearGradient id="plblu" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
<marker id="plarr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 Z" fill="#38bdf8"/></marker></defs>
<rect width="1200" height="430" fill="url(#plbg)" rx="12"/>
<text x="40" y="48" fill="#fff" font-size="24" font-weight="800">Planner patterns — match the loop to the task, cap everything</text>
<text x="40" y="72" fill="#94a3b8" font-size="13">ReAct explores · Plan-Execute parallelises · Reflexion retries · ToT votes. All need caps + verifiers.</text>
<g font-size="12" font-weight="700">
<rect x="40" y="100" width="260" height="110" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><text x="56" y="128" fill="#38bdf8">🔁 ReAct (3–15 calls)</text><text x="56" y="150" fill="#e2e8f0" font-weight="400">Thought→Action→Obs ×N</text><text x="56" y="170" fill="#e2e8f0" font-weight="400">unknown tools, research</text><text x="56" y="194" fill="#64748b" font-weight="400">cap 10 · stall→replan</text>
<rect x="320" y="100" width="260" height="110" rx="10" fill="url(#plgrn)"/><text x="336" y="128" fill="#fff">📋 Plan-Execute (2–8)</text><text x="336" y="150" fill="#d1fae5" font-weight="400">plan → parallel → merge</text><text x="336" y="170" fill="#d1fae5" font-weight="400">decomposable + known</text><text x="336" y="194" fill="#fff" font-weight="400">gate irreversible plans</text>
<rect x="600" y="100" width="260" height="110" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/><text x="616" y="128" fill="#f59e0b">🪞 Reflexion (4–12)</text><text x="616" y="150" fill="#e2e8f0" font-weight="400">attempt→critique→retry</text><text x="616" y="170" fill="#e2e8f0" font-weight="400">verifiable code/reason</text><text x="616" y="194" fill="#64748b" font-weight="400">critic ≠ actor</text>
<rect x="880" y="100" width="260" height="110" rx="10" fill="#0f172a" stroke="#8b5cf6" stroke-width="2"/><text x="896" y="128" fill="#a78bfa">🌳 ToT (k×depth)</text><text x="896" y="150" fill="#e2e8f0" font-weight="400">branch → score → keep</text><text x="896" y="170" fill="#e2e8f0" font-weight="400">1 critical decision</text><text x="896" y="194" fill="#64748b" font-weight="400">cap breadth hard</text>
</g>
<rect x="40" y="230" width="1120" height="60" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="256" fill="#fff" font-size="12" font-weight="700">Guards: step cap 8–12 · stall 2 → replan · irreversible plan → approval · external verifier (tests/tools/2nd model)</text>
<text x="60" y="278" fill="#94a3b8" font-size="11">Decision: decomposable+few unknowns → plan · verifiable+stakes → reflexion · critical+few unknowns → ToT · else ReAct.</text>
<rect x="40" y="310" width="1120" height="80" rx="10" fill="url(#plblu)"/>
<text x="60" y="338" fill="#fff" font-size="13" font-weight="800">Simulator below: describe the task → pattern + trace + call budget + caution.</text>
<text x="60" y="362" fill="#e0f2fe" font-size="12">Bad upfront plans poison branches; self-critics flatter — verify outside the loop.</text>
</svg>
