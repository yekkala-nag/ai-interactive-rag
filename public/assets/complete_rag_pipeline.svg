<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs>
<linearGradient id="cpbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#f8fafc"/><stop offset="100%" stop-color="#eef2f7"/></linearGradient>
</defs>
<style>
.flowline { stroke-dasharray: 8 8; animation: flowmv 1.4s linear infinite; }
@keyframes flowmv { to { stroke-dashoffset: -16; } }
@media (prefers-reduced-motion: reduce) { .flowline { animation: none; } }
</style>
<rect width="1200" height="780" fill="url(#cpbg)" rx="12"/>
<rect x="630" y="18" width="250" height="42" rx="6" fill="#fef9c3"/>
<text x="40" y="50" fill="#0f172a" font-size="34" font-weight="900">THE COMPLETE <tspan x="640" y="50">RAG PIPELINE</tspan></text>
<g font-size="12" font-weight="800" text-anchor="middle">
<rect x="40" y="92" width="140" height="32" rx="6" fill="#a5e3f5"/><text x="110" y="113" fill="#0f172a">STAGE 1</text>
<rect x="40" y="252" width="140" height="32" rx="6" fill="#c4b5fd"/><text x="110" y="273" fill="#0f172a">STAGE 2</text>
<rect x="40" y="412" width="140" height="32" rx="6" fill="#fde047"/><text x="110" y="433" fill="#0f172a">STAGE 3</text>
<rect x="40" y="572" width="140" height="32" rx="6" fill="#f9a8d4"/><text x="110" y="593" fill="#0f172a">STAGE 4</text>
<rect x="40" y="128" width="140" height="56" rx="6" fill="#fff" stroke="#a5e3f5" stroke-width="2"/><text x="110" y="152" fill="#0f172a">INGESTION</text>
<rect x="40" y="288" width="140" height="56" rx="6" fill="#fff" stroke="#c4b5fd" stroke-width="2"/><text x="110" y="312" fill="#0f172a">INDEXING</text>
<rect x="40" y="448" width="140" height="56" rx="6" fill="#fff" stroke="#fde047" stroke-width="2"/><text x="110" y="472" fill="#0f172a">RETRIEVAL</text>
<rect x="40" y="608" width="140" height="56" rx="6" fill="#fff" stroke="#f9a8d4" stroke-width="2"/><text x="110" y="626" fill="#0f172a" font-size="10">GENERATION</text><text x="110" y="642" fill="#0f172a" font-size="10">&amp; CHECK</text>
</g>
<g class="flowline" stroke-width="3" fill="none">
<line x1="110" y1="184" x2="110" y2="248" stroke="#7dd3fc"/>
<line x1="110" y1="344" x2="110" y2="408" stroke="#a78bfa"/>
<line x1="110" y1="504" x2="110" y2="568" stroke="#eab308"/>
<line x1="420" y1="150" x2="660" y2="150" stroke="#7dd3fc"/>
<line x1="420" y1="310" x2="660" y2="310" stroke="#a78bfa"/>
<line x1="420" y1="470" x2="660" y2="470" stroke="#eab308"/>
<line x1="420" y1="630" x2="660" y2="630" stroke="#f472b6"/>
</g>
<g font-size="11">
<g><rect x="200" y="92" width="220" height="112" rx="8" fill="#e0f7ff" stroke="#7dd3fc"/><text x="214" y="116" fill="#0f172a" font-size="14" font-weight="800">Source Collection</text><text x="214" y="134" fill="#334155">• Pull PDFs, APIs, sites</text><text x="214" y="150" fill="#334155">• Transcripts + raw text</text><text x="214" y="166" fill="#334155">• All downstream depends</text><text x="214" y="186" fill="#b91c1c">✕ gap = silent miss</text></g>
<g><rect x="440" y="92" width="220" height="112" rx="8" fill="#e0f7ff" stroke="#7dd3fc"/><text x="454" y="116" fill="#0f172a" font-size="14" font-weight="800">Document Loading</text><text x="454" y="134" fill="#334155">• Normalize formats</text><text x="454" y="150" fill="#334155">• Prep files for chunking</text><text x="454" y="166" fill="#b91c1c">✕ formats break parsing</text></g>
<g><rect x="680" y="92" width="220" height="112" rx="8" fill="#e0f7ff" stroke="#7dd3fc"/><text x="694" y="116" fill="#0f172a" font-size="14" font-weight="800">Semantic Chunking</text><text x="694" y="134" fill="#334155">• Meaning, not length</text><text x="694" y="150" fill="#334155">• Keep boundaries</text><text x="694" y="166" fill="#b91c1c">✕ fail → noisy retrieval</text></g>
<g><rect x="920" y="92" width="240" height="112" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="934" y="116" fill="#0f172a" font-size="13" font-weight="800">Try it live ↓</text><text x="934" y="134" fill="#334155">toggle any step off,</text><text x="934" y="150" fill="#334155">watch scores move.</text><text x="934" y="170" fill="#059669" font-weight="700">12 steps · animated</text></g>
<g><rect x="200" y="252" width="220" height="112" rx="8" fill="#ede9fe" stroke="#a78bfa"/><text x="214" y="276" fill="#0f172a" font-size="14" font-weight="800">Vector Store</text><text x="214" y="294" fill="#334155">• Fast lookup at scale</text><text x="214" y="310" fill="#334155">• Searchable KB out</text></g>
<g><rect x="440" y="252" width="220" height="112" rx="8" fill="#ede9fe" stroke="#a78bfa"/><text x="454" y="276" fill="#0f172a" font-size="14" font-weight="800">Vector Embeddings</text><text x="454" y="294" fill="#334155">• Meaning → vectors</text><text x="454" y="310" fill="#b91c1c">✕ off = full halt</text></g>
<g><rect x="680" y="252" width="220" height="112" rx="8" fill="#ede9fe" stroke="#a78bfa"/><text x="694" y="276" fill="#0f172a" font-size="14" font-weight="800">Metadata Tagging</text><text x="694" y="294" fill="#334155">• Author·title·tags</text><text x="694" y="310" fill="#b91c1c">✕ skip → precision dives</text></g>
<rect x="920" y="252" width="240" height="112" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/><text x="934" y="276" fill="#0f172a" font-size="13" font-weight="800">Live runner →</text><text x="934" y="294" fill="#334155">stages light up in order,</text><text x="934" y="310" fill="#334155">metrics count up.</text><text x="934" y="330" fill="#a16207" font-weight="700">honest, deterministic</text></text></rect>
<g><rect x="200" y="412" width="220" height="112" rx="8" fill="#fefce8" stroke="#facc15"/><text x="214" y="436" fill="#0f172a" font-size="14" font-weight="800">Query Rewriting</text><text x="214" y="454" fill="#334155">• Clarify vague queries</text><text x="214" y="470" fill="#334155">• Sharper in → sharper out</text><text x="214" y="490" fill="#b91c1c">✕ recall −30%</text></g>
<g><rect x="440" y="412" width="220" height="112" rx="8" fill="#fefce8" stroke="#facc15"/><text x="454" y="436" fill="#0f172a" font-size="14" font-weight="800">Hybrid Search</text><text x="454" y="454" fill="#334155">• Vector + keyword</text><text x="454" y="470" fill="#334155">• Covers vector gaps</text></g>
<g><rect x="680" y="412" width="220" height="112" rx="8" fill="#fefce8" stroke="#facc15"/><text x="694" y="436" fill="#0f172a" font-size="14" font-weight="800">Reranking</text><text x="694" y="454" fill="#334155">• True relevance model</text><text x="694" y="470" fill="#b91c1c">✕ distractor leads top-k</text></g>
<rect x="920" y="412" width="240" height="112" rx="8" fill="#fef9c3" stroke="#eab308"/><text x="934" y="436" fill="#0f172a" font-size="13" font-weight="800">k slider + 3 queries</text><text x="934" y="454" fill="#334155">refund · deductible</text><text x="934" y="470" fill="#334155">escalation — try all</text></text></rect>
<g><rect x="200" y="572" width="220" height="128" rx="8" fill="#fce7f3" stroke="#f9a8d4"/><text x="214" y="596" fill="#0f172a" font-size="14" font-weight="800">Evaluation</text><text x="214" y="614" fill="#334155">• Faithfulness·latency·cost</text><text x="214" y="630" fill="#334155">• Citations vs sources</text><text x="214" y="646" fill="#b91c1c">✕ skip → drift invisible</text><text x="214" y="662" fill="#64748b">runs FIRST in display,</text><text x="214" y="676" fill="#64748b">LAST in pipeline</text></g>
<g><rect x="440" y="572" width="220" height="128" rx="8" fill="#fce7f3" stroke="#f9a8d4"/><text x="454" y="596" fill="#0f172a" font-size="14" font-weight="800">Answer Generation</text><text x="454" y="614" fill="#334155">• Grounded in retrieval</text><text x="454" y="630" fill="#b91c1c">✕ no retrieval = invent</text><text x="454" y="646" fill="#64748b">the only LLM call</text><text x="454" y="662" fill="#64748b">that faces the user</text></g>
<g><rect x="680" y="572" width="220" height="128" rx="8" fill="#fce7f3" stroke="#f9a8d4"/><text x="694" y="596" fill="#0f172a" font-size="14" font-weight="800">Context Assembly</text><text x="694" y="614" fill="#334155">• Order + compress</text><text x="694" y="630" fill="#334155">• Fit signal in prompt</text><text x="694" y="646" fill="#b91c1c">✕ raw stuff truncates best</text></g>
<rect x="920" y="572" width="240" height="128" rx="8" fill="#0f172a"/><text x="934" y="596" fill="#fff" font-size="13" font-weight="800">The thesis, small:</text><text x="934" y="616" fill="#f9a8d4" font-size="12">order decides quality —</text><text x="934" y="634" fill="#f9a8d4" font-size="12">ingest → index →</text><text x="934" y="652" fill="#f9a8d4" font-size="12">retrieve → check.</text><text x="934" y="674" fill="#64748b" font-size="11">Skip check → ship drift.</text></text></rect>
</g>
</svg>
