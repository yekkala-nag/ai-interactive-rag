<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs>
<linearGradient id="rmbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#101a30"/></linearGradient>
<linearGradient id="rmflow" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#10b981"/><stop offset="100%" stop-color="#c9a84c"/></linearGradient>
</defs>
<style>
.flow { stroke-dasharray: 14 10; animation: dashmove 1.6s linear infinite; }
.pulse { animation: pulse 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes dashmove { to { stroke-dashoffset: -24; } }
@keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.35); opacity: 0.65; } }
@media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
</style>
<rect width="1200" height="460" fill="url(#rmbg)" rx="12"/>
<text x="40" y="48" fill="#fff" font-size="24" font-weight="800">AI Engineer Roadmap — 8 stages, one journey</text>
<text x="40" y="72" fill="#94a3b8" font-size="13">Adapted from roadmap.sh · every node opens a living topic below.</text>
<path d="M80,150 C 220,150 220,300 360,300 S 500,150 640,150 S 780,300 920,300 S 1060,220 1120,220" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
<path class="flow" d="M80,150 C 220,150 220,300 360,300 S 500,150 640,150 S 780,300 920,300 S 1060,220 1120,220" fill="none" stroke="url(#rmflow)" stroke-width="6" stroke-linecap="round"/>
<g font-size="12" font-weight="700" text-anchor="middle">
<g><circle cx="80" cy="150" r="26" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/><text x="80" y="156" fill="#fff">🧭</text><text x="80" y="196" fill="#e2e8f0">1 Orient</text></g>
<g><circle cx="240" cy="205" r="26" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/><text x="240" y="211" fill="#fff">🧠</text><text x="240" y="251" fill="#e2e8f0">2 How LLMs</text></g>
<g><circle cx="360" cy="300" r="26" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/><text x="360" y="306" fill="#fff">💬</text><text x="360" y="346" fill="#e2e8f0">3 Prompt</text></g>
<g><circle cx="520" cy="205" r="26" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/><text x="520" y="211" fill="#fff">🤖</text><text x="520" y="251" fill="#e2e8f0">4 Models</text></g>
<g><circle cx="640" cy="150" r="26" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/><text x="640" y="156" fill="#fff">🔍</text><text x="640" y="196" fill="#e2e8f0">5 Vectors</text></g>
<g><circle cx="800" cy="225" r="26" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/><text x="800" y="231" fill="#fff">⚡</text><text x="800" y="271" fill="#e2e8f0">6 RAG</text></g>
<g><circle cx="920" cy="300" r="26" fill="#0f172a" stroke="#10b981" stroke-width="3"/><text x="920" y="306" fill="#fff">🤝</text><text x="920" y="346" fill="#e2e8f0">7 Agents</text></g>
<g><circle class="pulse" cx="1060" cy="243" r="26" fill="#0f172a" stroke="#10b981" stroke-width="3"/><text x="1060" y="249" fill="#fff">🚀</text><text x="1060" y="289" fill="#e2e8f0">8 Ship</text></g>
</g>
<g font-size="11" fill="#64748b">
<text x="60" y="400">map → terms</text><text x="330" y="400">atoms → thought</text><text x="600" y="400">steer + evidence</text><text x="860" y="400">choose → serve → ground → orchestrate → prove</text>
</g>
<text x="40" y="432" fill="#475569" font-size="11"> underneath: each stage below is clickable — dots fill as you prove mastery. </text>
</svg>
