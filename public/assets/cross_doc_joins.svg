<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs><linearGradient id="cjbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#0e1a2e"/></linearGradient>
<linearGradient id="cjgrn" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
<linearGradient id="cjamb" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient></defs>
<rect width="1200" height="400" fill="url(#cjbg)" rx="12"/>
<text x="40" y="48" fill="#fff" font-size="24" font-weight="800">Cross-doc joins — align schemas, confirm ambiguity, join on validity</text>
<text x="40" y="72" fill="#94a3b8" font-size="13">prime_annuelle→premium_amount (0.97 auto) · garantie→coverage (0.72 needs human) · absent→NULL.</text>
<rect x="40" y="100" width="330" height="120" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
<text x="60" y="128" fill="#38bdf8" font-size="13" font-weight="800">Contract A (EN)</text>
<g font-size="11" font-family="monospace" fill="#e2e8f0"><text x="60" y="152">premium_amount · decimal</text><text x="60" y="170">start_date · date</text><text x="60" y="188">coverage · varchar</text><text x="60" y="206">deductible · decimal</text></g>
<rect x="390" y="100" width="330" height="120" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
<text x="410" y="128" fill="#f59e0b" font-size="13" font-weight="800">Contract B (FR)</text>
<g font-size="11" font-family="monospace" fill="#e2e8f0"><text x="410" y="152">prime_annuelle · decimal</text><text x="410" y="170">date_effet · date</text><text x="410" y="188">garantie · varchar ⚠0.72</text><text x="410" y="206">— absent → NULL</text></g>
<rect x="740" y="100" width="420" height="120" rx="10" fill="url(#cjgrn)"/>
<text x="760" y="128" fill="#fff" font-size="13" font-weight="800">Unified schedule → SUM works</text>
<g font-size="11" font-family="monospace" fill="#d1fae5"><text x="760" y="152">policy · premium_amount · start_date</text><text x="760" y="170">PX-1 1200 · PY-1 2100 · PX-2 950 …</text><text x="760" y="188">SELECT SUM(premium_amount) ✓</text><text x="760" y="206" fill="#fff">impossible before alignment</text></g>
<rect x="40" y="240" width="1120" height="60" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="264" fill="#fff" font-size="12" font-weight="700">Pipeline: harvest → propose (conf+evidence) → human confirms &lt;0.85 → validity join (never cross versions)</text>
<text x="60" y="286" fill="#94a3b8" font-size="11">Simulator: toggle ambiguous approval → unified rows, corpus total, translation warning.</text>
<rect x="40" y="315" width="1120" height="45" rx="10" fill="url(#cjamb)"/>
<text x="60" y="338" fill="#fff" font-size="11" font-weight="700">Audit: every mapping stores confidence + evidence + approver — corpus answers cite the mapping version.</text>
</svg>
