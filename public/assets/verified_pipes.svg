<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs><linearGradient id="vpbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#101a30"/></linearGradient>
<linearGradient id="vpred" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/></linearGradient>
<linearGradient id="vpgrn" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient></defs>
<rect width="1200" height="410" fill="url(#vpbg)" rx="12"/>
<text x="40" y="48" fill="#fff" font-size="24" font-weight="800">Review theater vs verified pipelines — PRs 2x, incidents/PR +243%</text>
<text x="40" y="72" fill="#94a3b8" font-size="13">Nobody can audit a 40k-line agent PR they didn't reason through. Gates can.</text>
<g font-size="12" font-weight="700">
<rect x="40" y="100" width="330" height="100" rx="10" fill="url(#vpred)"/><text x="56" y="128" fill="#fff">More reviewers ✕</text><text x="56" y="150" fill="#fecaca" font-weight="400">volume 2x, humans flat</text><text x="56" y="170" fill="#fecaca" font-weight="400">queue grows forever</text><text x="56" y="190" fill="#fff" font-weight="400">bugs +54% anyway</text>
<rect x="390" y="100" width="330" height="100" rx="10" fill="url(#vpred)"/><text x="406" y="128" fill="#fff">AI reviews AI ✕</text><text x="406" y="150" fill="#fecaca" font-weight="400">same data, same blinds</text><text x="406" y="170" fill="#fecaca" font-weight="400">correlated misses</text><text x="406" y="190" fill="#fff" font-weight="400">theater with GPUs</text>
<rect x="740" y="100" width="420" height="100" rx="10" fill="url(#vpgrn)"/><text x="756" y="128" fill="#fff">Policy-as-code gates ✓</text><text x="756" y="150" fill="#d1fae5" font-weight="400">tests · types · provenance · budgets</text><text x="756" y="170" fill="#d1fae5" font-weight="400">author-agnostic: human, agent, intern</text><text x="756" y="190" fill="#fff" font-weight="400">humans ONLY on exceptions</text>
</g>
<rect x="40" y="220" width="1120" height="60" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="244" fill="#fff" font-size="12" font-weight="700">Review earns keep on: intent match · ship-now judgment · novel shapes the pipeline hasn't codified</text>
<text x="60" y="266" fill="#94a3b8" font-size="11">Everything else belongs to the pipeline. Debate settled per-PR, not per-era.</text>
<rect x="40" y="300" width="720" height="70" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="326" fill="#fff" font-size="12" font-weight="700">Simulator: PR volume × review cover × gate strictness → escaped bugs + incidents/week</text>
<text x="60" y="348" fill="#94a3b8" font-size="11">Watch: gates-first beats reviewers-burning at every volume.</text>
<rect x="780" y="300" width="380" height="70" rx="10" fill="#0f172a" stroke="#c9a84c"/>
<text x="800" y="326" fill="#c9a84c" font-size="12" font-weight="800">DORA 2026: 90% use AI</text>
<text x="800" y="348" fill="#e2e8f0" font-size="11">Generation adopted faster than review. Move the gate.</text>
</svg>
