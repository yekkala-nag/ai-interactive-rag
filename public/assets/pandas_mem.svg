<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs><linearGradient id="pmbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#101a30"/></linearGradient>
<linearGradient id="pmgrn" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient></defs>
<rect width="1200" height="400" fill="url(#pmbg)" rx="12"/>
<text x="40" y="48" fill="#fff" font-size="24" font-weight="800">137MB → ~15MB: seven cuts, zero new dependencies</text>
<text x="40" y="72" fill="#94a3b8" font-size="13">25 cols × 100k rows demo: usecols 9x · category 75% · sparse ~40% · chunks fit anything.</text>
<g font-size="11" font-weight="700">
<rect x="40" y="100" width="150" height="70" rx="8" fill="#0f172a" stroke="#38bdf8"/><text x="52" y="124" fill="#fff">1 inplace ~2x</text><text x="52" y="144" fill="#94a3b8" font-weight="400">no ghost copy</text><text x="52" y="162" fill="#64748b" font-weight="400">mutates: beware</text>
<rect x="205" y="100" width="150" height="70" rx="8" fill="url(#pmgrn)"/><text x="217" y="124" fill="#fff">2 usecols 9x</text><text x="217" y="144" fill="#d1fae5" font-weight="400">137→15MB</text><text x="217" y="162" fill="#fff" font-weight="400">4x faster load</text>
<rect x="370" y="100" width="150" height="70" rx="8" fill="#0f172a" stroke="#38bdf8"/><text x="382" y="124" fill="#fff">3 downcast 2x</text><text x="382" y="144" fill="#94a3b8" font-weight="400">min-max fit</text><text x="382" y="162" fill="#64748b" font-weight="400">overflow wraps!</text>
<rect x="535" y="100" width="150" height="70" rx="8" fill="#0f172a" stroke="#38bdf8"/><text x="547" y="124" fill="#fff">4 category 75%</text><text x="547" y="144" fill="#94a3b8" font-weight="400">nunique≪n</text><text x="547" y="162" fill="#64748b" font-weight="400">high-card worse</text>
<rect x="700" y="100" width="150" height="70" rx="8" fill="#0f172a" stroke="#38bdf8"/><text x="712" y="124" fill="#fff">5 sparse 40%</text><text x="712" y="144" fill="#94a3b8" font-weight="400">NaN-heavy</text><text x="712" y="162" fill="#64748b" font-weight="400">dense ops densify</text>
<rect x="865" y="100" width="150" height="70" rx="8" fill="#0f172a" stroke="#38bdf8"/><text x="877" y="124" fill="#fff">6 dtype@read</text><text x="877" y="144" fill="#94a3b8" font-weight="400">no fat peak</text><text x="877" y="162" fill="#64748b" font-weight="400">verify guesses</text>
<rect x="1030" y="100" width="130" height="70" rx="8" fill="#0f172a" stroke="#f59e0b"/><text x="1040" y="124" fill="#f59e0b">7 chunks</text><text x="1040" y="144" fill="#e2e8f0" font-weight="400">fits all</text><text x="1040" y="162" fill="#64748b" font-weight="400">no global ops</text>
</g>
<rect x="40" y="190" width="1120" height="60" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="214" fill="#fff" font-size="12" font-weight="700">Order matters: subset + dtypes at read (never materialize fat) → tighten → stream the tail</text>
<text x="60" y="236" fill="#94a3b8" font-size="11">Pandas defaults to the fattest type always. Assume nothing, measure with .info().</text>
<rect x="40" y="270" width="720" height="90" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="296" fill="#fff" font-size="12" font-weight="700">Simulator: rows × cols × categorical% × NaN% + toggles → MB before/after + verdict.</text>
<text x="60" y="318" fill="#94a3b8" font-size="11">Subtle, overlooked, compounding — the cheapest performance work in data science.</text>
<rect x="780" y="270" width="380" height="90" rx="10" fill="url(#pmgrn)"/>
<text x="800" y="296" fill="#fff" font-size="12" font-weight="800">A. Chawla · reference numbers</text>
<text x="800" y="318" fill="#d1fae5" font-size="11">25×100k · 137MB · 15MB · 4x load. Real frame, real math.</text>
</svg>
