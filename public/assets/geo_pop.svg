<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs><linearGradient id="gpbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#0e1a2e"/></linearGradient>
<linearGradient id="gpblu" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
<linearGradient id="gpgrn" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient></defs>
<rect width="1200" height="400" fill="url(#gpbg)" rx="12"/>
<text x="40" y="48" fill="#fff" font-size="24" font-weight="800">Two population maps, one Vietnam: 97.34M vs 98.16M</text>
<text x="40" y="72" fill="#94a3b8" font-size="13">WorldPop 100m raster vs Facebook 30m points, masked by GADM polygons. Agree nationally, diverge locally.</text>
<g font-size="12" font-weight="700">
<rect x="40" y="100" width="330" height="110" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><text x="56" y="128" fill="#38bdf8">GADM boundaries</text><text x="56" y="150" fill="#e2e8f0" font-weight="400">63 L1 · 686 L2 · 7658 L3</text><text x="56" y="170" fill="#e2e8f0" font-weight="400">geopandas.read_file</text><text x="56" y="190" fill="#64748b" font-weight="400">polygons to count into</text>
<rect x="390" y="100" width="330" height="110" rx="10" fill="url(#gpblu)"/><text x="406" y="128" fill="#fff">WorldPop raster</text><text x="406" y="150" fill="#e0f2fe" font-weight="400">TIFF 100m · RF + micro-census</text><text x="406" y="170" fill="#e0f2fe" font-weight="400">rasterio mask → 97.34M</text><text x="406" y="190" fill="#fff" font-weight="400">1 band: people per pixel</text>
<rect x="740" y="100" width="420" height="110" rx="10" fill="url(#gpgrn)"/><text x="756" y="128" fill="#fff">Facebook HRSL vector</text><text x="756" y="150" fill="#d1fae5" font-weight="400">CSV lat/lon/pop · 30m buildings</text><text x="756" y="170" fill="#d1fae5" font-weight="400">→ GeoDataFrame → 98.16M</text><text x="756" y="190" fill="#fff" font-weight="400">UN-adjusted 2015/2020</text>
</g>
<rect x="40" y="230" width="560" height="70" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="256" fill="#fff" font-size="12" font-weight="700">45°-line test: L0/L1 agree · L2 HCMC + Binh Duong split</text>
<text x="60" y="278" fill="#94a3b8" font-size="11">Identical only where it doesn't matter. Question decides source.</text>
<rect x="620" y="230" width="540" height="70" rx="10" fill="#0f172a" stroke="#c9a84c"/>
<text x="640" y="256" fill="#c9a84c" font-size="12" font-weight="800">JPNE: notebooks as collaboration</text>
<text x="640" y="278" fill="#e2e8f0" font-size="11">Code + prose + visuals, no installs — domain experts in the loop.</text>
<rect x="40" y="320" width="1120" height="40" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="342" fill="#94a3b8" font-size="11">Simulator: admin level → correlation, gap, which-source guidance. Raster = surfaces · vector = boundaries.</text>
</svg>
