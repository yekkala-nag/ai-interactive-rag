<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs><linearGradient id="rlbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#0e1a2e"/></linearGradient>
<linearGradient id="rlgrn" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
<linearGradient id="rlblu" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient></defs>
<rect width="1200" height="420" fill="url(#rlbg)" rx="12"/>
<text x="40" y="48" fill="#fff" font-size="24" font-weight="800">TRPO → PPO → GRPO: same RL, cheaper trust regions</text>
<text x="40" y="72" fill="#94a3b8" font-size="13">Pretrain → SFT → RLHF. Tokens are actions; rewards reshape the policy. DeepSeek runs on GRPO.</text>
<g font-size="12" font-weight="700">
<rect x="40" y="100" width="330" height="110" rx="10" fill="#0f172a" stroke="#475569" stroke-width="2"/><text x="56" y="128" fill="#fff">TRPO (2017)</text><text x="56" y="150" fill="#e2e8f0" font-weight="400">advantage × ratio, hard KL cap</text><text x="56" y="170" fill="#e2e8f0" font-weight="400">stable · heavy gradients</text><text x="56" y="194" fill="#64748b" font-weight="400">history for LLMs</text>
<rect x="390" y="100" width="330" height="110" rx="10" fill="url(#rlblu)"/><text x="406" y="128" fill="#fff">PPO (ChatGPT era)</text><text x="406" y="150" fill="#e0f2fe" font-weight="400">clipped surrogate, implicit caution</text><text x="406" y="170" fill="#e0f2fe" font-weight="400">+ value model w/ discounts</text><text x="406" y="194" fill="#fff" font-weight="400">the default</text>
<rect x="740" y="100" width="420" height="110" rx="10" fill="url(#rlgrn)"/><text x="756" y="128" fill="#fff">GRPO (DeepSeek) ★</text><text x="756" y="150" fill="#d1fae5" font-weight="400">group rewards → z-score advantages</text><text x="756" y="170" fill="#d1fae5" font-weight="400">NO value model · KL-to-reference inline</text><text x="756" y="190" fill="#fff" font-weight="400">faster · cheaper · same roots</text>
</g>
<rect x="40" y="230" width="560" height="70" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="256" fill="#fff" font-size="12" font-weight="700">Value attribution: "2+2 is 4"→0.8 · "2+2 is"→0.8γ · "2+2"→0.8γ²</text>
<text x="60" y="278" fill="#94a3b8" font-size="11">Credit fades backward. GRPO replaces all of it with group statistics.</text>
<rect x="620" y="230" width="540" height="70" rx="10" fill="#0f172a" stroke="#c9a84c"/>
<text x="640" y="256" fill="#c9a84c" font-size="12" font-weight="800">Reward ≠ value model (don't conflate)</text>
<text x="640" y="278" fill="#e2e8f0" font-size="11">Reward: pre-trained human ranks · Value: concurrent expected return.</text>
<rect x="40" y="320" width="1120" height="60" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="344" fill="#94a3b8" font-size="11">Simulator: enter group rewards → z-scores, push-up/push-down readout. M. Wolf, TDS · RL may outrun pretraining next.</text>
</svg>
