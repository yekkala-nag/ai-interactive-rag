<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs><linearGradient id="a2bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#101a30"/></linearGradient>
<linearGradient id="a2blu" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
<linearGradient id="a2grn" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
<marker id="a2arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 Z" fill="#38bdf8"/></marker></defs>
<rect width="1200" height="420" fill="url(#a2bg)" rx="12"/>
<text x="40" y="48" fill="#fff" font-size="24" font-weight="800">Agent mesh — supervisor default, A2A at scale, chains for stable flows</text>
<text x="40" y="72" fill="#94a3b8" font-size="13">Messages: chain n−1 · star 2n · mesh n(n−1)/2. Mesh dies past ~6 agents.</text>
<g font-size="12" font-weight="700">
<rect x="40" y="100" width="330" height="100" rx="10" fill="url(#a2grn)"/><text x="56" y="128" fill="#fff">★ Supervisor (default)</text><text x="56" y="150" fill="#d1fae5" font-weight="400">leader splits + merges</text><text x="56" y="170" fill="#d1fae5" font-weight="400">2 msgs / subtask</text><text x="56" y="190" fill="#fff" font-weight="400">shard past ~8 workers</text>
<rect x="390" y="100" width="330" height="100" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><text x="406" y="128" fill="#38bdf8">A2A peers + registry</text><text x="406" y="150" fill="#e2e8f0" font-weight="400">contracts + pins</text><text x="406" y="170" fill="#e2e8f0" font-weight="400">n(n−1)/2 messages</text><text x="406" y="190" fill="#64748b" font-weight="400">fail closed on skew</text>
<rect x="740" y="100" width="420" height="100" rx="10" fill="#0f172a" stroke="#475569" stroke-width="2"/><text x="756" y="128" fill="#fff">Chain · MCP tools · Blackboard</text><text x="756" y="150" fill="#e2e8f0" font-weight="400">chain: typed handoffs, n−1 msgs</text><text x="756" y="170" fill="#e2e8f0" font-weight="400">MCP: scope tools (confused deputy)</text><text x="756" y="190" fill="#e2e8f0" font-weight="400">board: lease + schema writes</text>
</g>
<rect x="40" y="220" width="700" height="80" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="248" fill="#fff" font-size="13" font-weight="800">n=5, 120ms/msg → chain 4 msgs/0.5s · star 10/1.2s · mesh 10/1.2s (but discovery + skew)</text>
<text x="60" y="272" fill="#94a3b8" font-size="12">n=8 → mesh 28 msgs. Topology is a cost decision, not a style choice.</text>
<rect x="760" y="220" width="400" height="80" rx="10" fill="url(#a2blu)"/>
<text x="780" y="248" fill="#fff" font-size="13" font-weight="800">Registry rule</text>
<text x="780" y="272" fill="#e0f2fe" font-size="12">agent:name@version pinned · unknown peer = fail closed.</text>
<rect x="40" y="320" width="1120" height="60" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="346" fill="#94a3b8" font-size="12">Simulator: agents × topology → messages, latency, bottleneck + switch advice.</text>
</svg>
