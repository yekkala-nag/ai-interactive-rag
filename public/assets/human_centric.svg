<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs><linearGradient id="hcbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#0e1a2e"/></linearGradient>
<linearGradient id="hcamb" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
<linearGradient id="hcgrn" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient></defs>
<rect width="1200" height="410" fill="url(#hcbg)" rx="12"/>
<text x="40" y="48" fill="#fff" font-size="24" font-weight="800">Satisfied ≠ unharmed — design for humans, not metrics</text>
<text x="40" y="72" fill="#94a3b8" font-size="13">Smokers love cigarettes. Filter bubbles please. Compliance trails harm. Values must be designed in.</text>
<g font-size="12" font-weight="700">
<rect x="40" y="100" width="330" height="100" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="2"/><text x="56" y="128" fill="#ef4444">Blind spots</text><text x="56" y="150" fill="#e2e8f0" font-weight="400">compartmentalized metrics</text><text x="56" y="170" fill="#e2e8f0" font-weight="400">satisfaction ≄ good</text><text x="56" y="190" fill="#64748b" font-weight="400">non-voluntary exposure</text>
<rect x="390" y="100" width="330" height="100" rx="10" fill="url(#hcamb)"/><text x="406" y="128" fill="#fff">Compliance ≠ safety</text><text x="406" y="150" fill="#ffedd5" font-weight="400">law trails harm</text><text x="406" y="170" fill="#ffedd5" font-weight="400">cookie burden on citizens</text><text x="406" y="190" fill="#fff" font-weight="400">FAccT ≠ human values</text>
<rect x="740" y="100" width="420" height="100" rx="10" fill="url(#hcgrn)"/><text x="756" y="128" fill="#fff">Concentric rollout ✓</text><text x="756" y="150" fill="#d1fae5" font-weight="400">support → automate (earn it)</text><text x="756" y="170" fill="#d1fae5" font-weight="400">internal → customer (us first)</text><text x="756" y="190" fill="#fff" font-weight="400">VSD: ethnography → metrics</text>
</g>
<rect x="40" y="220" width="1120" height="60" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="244" fill="#fff" font-size="12" font-weight="700">Risk = autonomy × exposure (0–6): GREEN proceed · AMBER gate · RED halt for ethics review</text>
<text x="60" y="266" fill="#94a3b8" font-size="11">Everyone in the chain shares pareto no-harm duty — "just algorithms" is over.</text>
<rect x="40" y="300" width="720" height="70" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="326" fill="#fff" font-size="12" font-weight="700">Simulator: autonomy × exposure sliders → zone + required controls.</text>
<text x="60" y="348" fill="#94a3b8" font-size="11">Would you defend this in ten years? Write that defense down.</text>
<rect x="780" y="300" width="380" height="70" rx="10" fill="#0f172a" stroke="#c9a84c"/>
<text x="800" y="326" fill="#c9a84c" font-size="12" font-weight="800">M. Graus · mortgage-scale stakes</text>
<text x="800" y="348" fill="#e2e8f0" font-size="11">Biggest purchase of a life. Act like it.</text>
</svg>
