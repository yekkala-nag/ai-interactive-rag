<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs><linearGradient id="hibg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#0e1a2e"/></linearGradient>
<linearGradient id="hired" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/></linearGradient>
<linearGradient id="higrn" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
<linearGradient id="hiamb" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient></defs>
<rect width="1200" height="420" fill="url(#hibg)" rx="12"/>
<text x="40" y="48" fill="#fff" font-size="24" font-weight="800">HITL — risk score picks the autonomy level, audit logs everything</text>
<text x="40" y="72" fill="#94a3b8" font-size="13">score = irreversible(3) + blast(0–3) + low-conf(2) + novel(2) · ≥6 → L1 · ≥3 → L2 · else L3.</text>
<g font-size="12" font-weight="700">
<rect x="40" y="100" width="340" height="100" rx="10" fill="url(#hired)"/><text x="56" y="128" fill="#fff">L1 supervised (score ≥6)</text><text x="56" y="150" fill="#fecaca" font-weight="400">approval gate per act</text><text x="56" y="170" fill="#fecaca" font-weight="400">delete · pay · publish</text><text x="56" y="190" fill="#fff" font-weight="400">batch + risk-sort vs fatigue</text>
<rect x="400" y="100" width="340" height="100" rx="10" fill="url(#hiamb)"/><text x="416" y="128" fill="#fff">L2 bounded (3–5)</text><text x="416" y="150" fill="#ffedd5" font-weight="400">class approval + samples</text><text x="416" y="170" fill="#ffedd5" font-weight="400">refunds &lt; $50 auto</text><text x="416" y="190" fill="#fff" font-weight="400">log overrides, tune threshold</text>
<rect x="760" y="100" width="400" height="100" rx="10" fill="url(#higrn)"/><text x="776" y="128" fill="#fff">L3 autonomous (&lt;3) + audit</text><text x="776" y="150" fill="#d1fae5" font-weight="400">reversible · narrow · confident</text><text x="776" y="170" fill="#d1fae5" font-weight="400">read-only monitors</text><text x="776" y="190" fill="#fff" font-weight="400">kill-switch + async review</text>
</g>
<rect x="40" y="220" width="560" height="80" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="248" fill="#fff" font-size="13" font-weight="800">Four gates: approve (irreversible) · suggest-edit (drafts) · escalate (low-conf/novel) · audit (always)</text>
<text x="60" y="272" fill="#94a3b8" font-size="12">Audit never sleeps — but it can't un-send. Pair with gates for irreversible acts.</text>
<rect x="620" y="220" width="540" height="80" rx="10" fill="#0f172a" stroke="#c9a84c"/>
<text x="640" y="248" fill="#c9a84c" font-size="13" font-weight="800">Fatigue defence</text>
<text x="640" y="272" fill="#e2e8f0" font-size="12">Risk-ordered queues · batch similar · require diff review, never blind approve.</text>
<rect x="40" y="320" width="1120" height="60" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="346" fill="#94a3b8" font-size="12">Simulator: irreversibility × blast × confidence × novelty → required gate + autonomy + reason.</text>
</svg>
