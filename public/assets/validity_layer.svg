<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs><linearGradient id="vlbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#101a30"/></linearGradient>
<linearGradient id="vlgrn" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
<linearGradient id="vlred" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/></linearGradient></defs>
<rect width="1200" height="440" fill="url(#vlbg)" rx="12"/>
<text x="40" y="48" fill="#fff" font-size="24" font-weight="800">Presence ≠ validity — flight $420 → $610, two executors</text>
<text x="40" y="72" fill="#94a3b8" font-size="13">Baseline discovers at act time (2 doomed steps). Aware checks first (0 doomed).</text>
<g font-size="12" font-weight="700">
<rect x="40" y="100" width="520" height="130" rx="10" fill="url(#vlred)"/><text x="60" y="128" fill="#fff">Baseline: plan → act → FAIL → recover</text><text x="60" y="150" fill="#fecaca" font-weight="400">10:00 $420 known · 10:03 jumps $610</text><text x="60" y="170" fill="#fecaca" font-weight="400">10:04 books on dead plan (doomed ×2)</text><text x="60" y="192" fill="#fff" font-weight="400">9 steps · fails budgets 6–8</text><text x="60" y="212" fill="#fecaca" font-weight="400">PFW = closure − 1, always</text>
<rect x="580" y="100" width="580" height="130" rx="10" fill="url(#vlgrn)"/><text x="600" y="128" fill="#fff">Aware: check → verify/replan → act</text><text x="600" y="150" fill="#d1fae5" font-weight="400">ACTIVE→act · SUPERSEDED→replan · STALE?→verify</text><text x="600" y="170" fill="#d1fae5" font-weight="400">$610 caught pre-act, replans immediately</text><text x="600" y="192" fill="#fff" font-weight="400">6 steps · completes budgets 6–8</text><text x="600" y="212" fill="#d1fae5" font-weight="400">PFW = 0 · honest cost: false-alarm verify</text>
</g>
<g font-size="11" font-weight="700">
<rect x="40" y="250" width="250" height="56" rx="8" fill="#0f172a" stroke="#10b981"/><text x="56" y="272" fill="#10b981">ACTIVE → act</text>
<rect x="310" y="250" width="250" height="56" rx="8" fill="#0f172a" stroke="#ef4444"/><text x="326" y="272" fill="#ef4444">SUPERSEDED → replan</text>
<rect x="580" y="250" width="250" height="56" rx="8" fill="#0f172a" stroke="#f59e0b"/><text x="596" y="272" fill="#f59e0b">STALE → verify 1 step</text>
<rect x="850" y="250" width="250" height="56" rx="8" fill="#0f172a" stroke="#38bdf8"/><text x="866" y="272" fill="#38bdf8">UNKNOWN → verify, not fail</text>
</g>
<rect x="40" y="326" width="720" height="74" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="352" fill="#fff" font-size="12" font-weight="700">96 configs: shape never mattered — size did. Isolation: 7 doomed flat as plans grow 8→50.</text>
<text x="60" y="374" fill="#94a3b8" font-size="11">Factual vs operational invalidity: true-but-useless (DB offline) needs dependency checks, not timestamps.</text>
<rect x="780" y="326" width="380" height="74" rx="10" fill="#0f172a" stroke="#c9a84c"/>
<text x="800" y="352" fill="#c9a84c" font-size="12" font-weight="800">Build when: costly acts · long sessions · hard budgets</text>
<text x="800" y="374" fill="#e2e8f0" font-size="11">Skip: single-shot · cheap retry · static lookups.</text>
</svg>
