<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#0a0e1c"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="580" fill="url(#bgGrad)" rx="12"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-width="1" stroke-opacity="0.04">
    <line x1="60" y1="0" x2="60" y2="580"/>
    <line x1="300" y1="0" x2="300" y2="580"/>
    <line x1="600" y1="0" x2="600" y2="580"/>
    <line x1="900" y1="0" x2="900" y2="580"/>
    <line x1="1140" y1="0" x2="1140" y2="580"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="460" x2="1200" y2="460"/>
  </g>

  <!-- Header Section -->
  <rect x="40" y="24" width="1120" height="60" rx="8" fill="#111827" fill-opacity="0.6" stroke="#1f2937" stroke-width="1"/>
  <text x="60" y="52" fill="#38bdf8" font-size="18" font-weight="700" letter-spacing="0.5">RAG CHUNKING STRATEGY TAXONOMY &amp; DECISION MATRIX</text>
  <text x="60" y="70" fill="#94a3b8" font-size="12">From Naive Fixed-Size Windowing to Hierarchical Parent-Child, Anthropic Contextual Retrieval &amp; Jina Late Chunking</text>
  <rect x="980" y="38" width="160" height="28" rx="6" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
  <text x="1060" y="56" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">⚡ RAG PIPELINE v3.2</text>

  <!-- COLUMN 1: NAIVE FIXED-SIZE -->
  <g transform="translate(40, 100)">
    <rect width="265" height="380" rx="10" fill="url(#cardGrad1)" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="40" rx="10" fill="#ef4444" fill-opacity="0.15"/>
    <text x="16" y="25" fill="#f87171" font-size="14" font-weight="700">1. Naive Fixed-Size</text>
    <rect x="185" y="10" width="68" height="20" rx="4" fill="#ef4444" fill-opacity="0.25"/>
    <text x="219" y="24" fill="#fca5a5" font-size="10" font-weight="600" text-anchor="middle">HIGH RISK</text>

    <!-- Visual Representation -->
    <rect x="16" y="55" width="233" height="70" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="26" y="75" fill="#94a3b8" font-size="10" font-family="monospace">Doc: [--- Chunk 1 ---] |</text>
    <line x1="160" y1="60" x2="160" y2="120" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="165" y="90" fill="#ef4444" font-size="9" font-weight="bold">CUT MID-SENTENCE</text>
    <text x="26" y="108" fill="#64748b" font-size="10" font-family="monospace">|[--- Chunk 2 ---]</text>

    <!-- Specs -->
    <text x="16" y="145" fill="#e2e8f0" font-size="12" font-weight="600">Characteristics:</text>
    <text x="16" y="165" fill="#94a3b8" font-size="11">• Hard token/char count (e.g. 500t)</text>
    <text x="16" y="185" fill="#94a3b8" font-size="11">• Constant sliding overlap (10%)</text>
    <text x="16" y="205" fill="#f87171" font-size="11">• Severed clauses &amp; table rows</text>
    <text x="16" y="225" fill="#f87171" font-size="11">• Lost header context</text>

    <!-- Metrics Box -->
    <rect x="16" y="245" width="233" height="85" rx="6" fill="#090d16" stroke="#1e293b"/>
    <text x="26" y="265" fill="#64748b" font-size="10">Retrieval Precision:</text>
    <text x="235" y="265" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="end">42% (Poor)</text>
    <text x="26" y="285" fill="#64748b" font-size="10">Ingestion Latency:</text>
    <text x="235" y="285" fill="#10b981" font-size="11" font-weight="bold" text-anchor="end">&lt; 1ms (Instant)</text>
    <text x="26" y="305" fill="#64748b" font-size="10">Compute Cost:</text>
    <text x="235" y="305" fill="#10b981" font-size="11" font-weight="bold" text-anchor="end">$ (Minimal)</text>
    <text x="26" y="322" fill="#64748b" font-size="10">Context Retention:</text>
    <text x="235" y="322" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="end">35%</text>

    <!-- Footer recommendation -->
    <rect x="16" y="340" width="233" height="28" rx="4" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-opacity="0.3"/>
    <text x="132" y="358" fill="#fca5a5" font-size="10" font-weight="600" text-anchor="middle">⚠️ Only for simple raw logs</text>
  </g>

  <!-- COLUMN 2: RECURSIVE & STRUCTURAL -->
  <g transform="translate(325, 100)">
    <rect width="265" height="380" rx="10" fill="url(#cardGrad1)" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="40" rx="10" fill="#3b82f6" fill-opacity="0.15"/>
    <text x="16" y="25" fill="#60a5fa" font-size="14" font-weight="700">2. Recursive / Structural</text>
    <rect x="185" y="10" width="68" height="20" rx="4" fill="#3b82f6" fill-opacity="0.25"/>
    <text x="219" y="24" fill="#93c5fd" font-size="10" font-weight="600" text-anchor="middle">BALANCED</text>

    <!-- Visual Representation -->
    <rect x="16" y="55" width="233" height="70" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="26" y="75" fill="#60a5fa" font-size="10" font-family="monospace"># Header 1 → ## Subheader</text>
    <rect x="26" y="85" width="95" height="30" rx="4" fill="#1e3a8a" fill-opacity="0.4" stroke="#3b82f6"/>
    <text x="73" y="103" fill="#93c5fd" font-size="9" text-anchor="middle">Paragraph 1</text>
    <rect x="135" y="85" width="95" height="30" rx="4" fill="#1e3a8a" fill-opacity="0.4" stroke="#3b82f6"/>
    <text x="182" y="103" fill="#93c5fd" font-size="9" text-anchor="middle">Paragraph 2</text>

    <!-- Specs -->
    <text x="16" y="145" fill="#e2e8f0" font-size="12" font-weight="600">Characteristics:</text>
    <text x="16" y="165" fill="#94a3b8" font-size="11">• Separator cascade (\n\n → \n → . )</text>
    <text x="16" y="185" fill="#94a3b8" font-size="11">• Markdown / HTML header aware</text>
    <text x="16" y="205" fill="#10b981" font-size="11">• Zero broken sentence boundaries</text>
    <text x="16" y="225" fill="#94a3b8" font-size="11">• LangChain / LlamaIndex default</text>

    <!-- Metrics Box -->
    <rect x="16" y="245" width="233" height="85" rx="6" fill="#090d16" stroke="#1e293b"/>
    <text x="26" y="265" fill="#64748b" font-size="10">Retrieval Precision:</text>
    <text x="235" y="265" fill="#60a5fa" font-size="11" font-weight="bold" text-anchor="end">68% (Good)</text>
    <text x="26" y="285" fill="#64748b" font-size="10">Ingestion Latency:</text>
    <text x="235" y="285" fill="#10b981" font-size="11" font-weight="bold" text-anchor="end">3ms (Fast)</text>
    <text x="26" y="305" fill="#64748b" font-size="10">Compute Cost:</text>
    <text x="235" y="305" fill="#10b981" font-size="11" font-weight="bold" text-anchor="end">$ (Standard)</text>
    <text x="26" y="322" fill="#64748b" font-size="10">Context Retention:</text>
    <text x="235" y="322" fill="#60a5fa" font-size="11" font-weight="bold" text-anchor="end">65%</text>

    <!-- Footer recommendation -->
    <rect x="16" y="340" width="233" height="28" rx="4" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-opacity="0.3"/>
    <text x="132" y="358" fill="#93c5fd" font-size="10" font-weight="600" text-anchor="middle">✅ Solid baseline for technical docs</text>
  </g>

  <!-- COLUMN 3: PARENT-CHILD / HIERARCHICAL -->
  <g transform="translate(610, 100)">
    <rect width="265" height="380" rx="10" fill="url(#cardGrad1)" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="40" rx="10" fill="#10b981" fill-opacity="0.15"/>
    <text x="16" y="25" fill="#34d399" font-size="14" font-weight="700">3. Parent-Child / Window</text>
    <rect x="185" y="10" width="68" height="20" rx="4" fill="#10b981" fill-opacity="0.25"/>
    <text x="219" y="24" fill="#6ee7b7" font-size="10" font-weight="600" text-anchor="middle">OPTIMAL</text>

    <!-- Visual Representation -->
    <rect x="16" y="55" width="233" height="70" rx="6" fill="#0f172a" stroke="#334155"/>
    <rect x="26" y="63" width="213" height="22" rx="3" fill="#065f46" fill-opacity="0.3" stroke="#10b981"/>
    <text x="132" y="78" fill="#6ee7b7" font-size="9" font-weight="bold" text-anchor="middle">Parent Doc Section (2048 tokens context)</text>
    <rect x="36" y="93" width="55" height="22" rx="3" fill="#047857" stroke="#34d399"/>
    <text x="63" y="107" fill="#ffffff" font-size="8" text-anchor="middle">Child #1 (128t)</text>
    <rect x="105" y="93" width="55" height="22" rx="3" fill="#047857" stroke="#34d399"/>
    <text x="132" y="107" fill="#ffffff" font-size="8" text-anchor="middle">Child #2 (128t)</text>
    <rect x="174" y="93" width="55" height="22" rx="3" fill="#047857" stroke="#34d399"/>
    <text x="201" y="107" fill="#ffffff" font-size="8" text-anchor="middle">Child #3 (128t)</text>

    <!-- Specs -->
    <text x="16" y="145" fill="#e2e8f0" font-size="12" font-weight="600">Characteristics:</text>
    <text x="16" y="165" fill="#94a3b8" font-size="11">• Small child chunks for vector index</text>
    <text x="16" y="185" fill="#94a3b8" font-size="11">• Large parent chunk returned to LLM</text>
    <text x="16" y="205" fill="#10b981" font-size="11">• High retrieval accuracy + full context</text>
    <text x="16" y="225" fill="#10b981" font-size="11">• Eliminates needle-in-haystack loss</text>

    <!-- Metrics Box -->
    <rect x="16" y="245" width="233" height="85" rx="6" fill="#090d16" stroke="#1e293b"/>
    <text x="26" y="265" fill="#64748b" font-size="10">Retrieval Precision:</text>
    <text x="235" y="265" fill="#10b981" font-size="11" font-weight="bold" text-anchor="end">88% (High)</text>
    <text x="26" y="285" fill="#64748b" font-size="10">Ingestion Latency:</text>
    <text x="235" y="285" fill="#10b981" font-size="11" font-weight="bold" text-anchor="end">8ms (Fast)</text>
    <text x="26" y="305" fill="#64748b" font-size="10">Compute Cost:</text>
    <text x="235" y="305" fill="#3b82f6" font-size="11" font-weight="bold" text-anchor="end">$$ (Storage)</text>
    <text x="26" y="322" fill="#64748b" font-size="10">Context Retention:</text>
    <text x="235" y="322" fill="#10b981" font-size="11" font-weight="bold" text-anchor="end">92%</text>

    <!-- Footer recommendation -->
    <rect x="16" y="340" width="233" height="28" rx="4" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-opacity="0.3"/>
    <text x="132" y="358" fill="#6ee7b7" font-size="10" font-weight="600" text-anchor="middle">⭐ Production Recommended Default</text>
  </g>

  <!-- COLUMN 4: CONTEXTUAL & LATE CHUNKING -->
  <g transform="translate(895, 100)">
    <rect width="265" height="380" rx="10" fill="url(#cardGrad1)" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="0" y="0" width="265" height="40" rx="10" fill="#8b5cf6" fill-opacity="0.15"/>
    <text x="16" y="25" fill="#c084fc" font-size="14" font-weight="700">4. Contextual &amp; Late</text>
    <rect x="185" y="10" width="68" height="20" rx="4" fill="#8b5cf6" fill-opacity="0.25"/>
    <text x="219" y="24" fill="#e9d5ff" font-size="10" font-weight="600" text-anchor="middle">SOTA AI</text>

    <!-- Visual Representation -->
    <rect x="16" y="55" width="233" height="70" rx="6" fill="#0f172a" stroke="#334155"/>
    <rect x="24" y="63" width="217" height="22" rx="3" fill="#581c87" fill-opacity="0.4" stroke="#a855f7"/>
    <text x="132" y="78" fill="#d8b4fe" font-size="9" text-anchor="middle">✨ Document-Level LLM Context Prefix</text>
    <rect x="24" y="93" width="217" height="22" rx="3" fill="#3b0764" stroke="#c084fc"/>
    <text x="132" y="107" fill="#f3e8ff" font-size="8" font-family="monospace" text-anchor="middle">Bidirectional Attention Across Full Doc</text>

    <!-- Specs -->
    <text x="16" y="145" fill="#e2e8f0" font-size="12" font-weight="600">Characteristics:</text>
    <text x="16" y="165" fill="#94a3b8" font-size="11">• Anthropic: LLM situates each chunk</text>
    <text x="16" y="185" fill="#94a3b8" font-size="11">• Jina: Embed doc first, pool later</text>
    <text x="16" y="205" fill="#c084fc" font-size="11">• 100% semantic boundary preservation</text>
    <text x="16" y="225" fill="#c084fc" font-size="11">• +35% hybrid BM25 / vector boost</text>

    <!-- Metrics Box -->
    <rect x="16" y="245" width="233" height="85" rx="6" fill="#090d16" stroke="#1e293b"/>
    <text x="26" y="265" fill="#64748b" font-size="10">Retrieval Precision:</text>
    <text x="235" y="265" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="end">94% (SOTA)</text>
    <text x="26" y="285" fill="#64748b" font-size="10">Ingestion Latency:</text>
    <text x="235" y="285" fill="#f59e0b" font-size="11" font-weight="bold" text-anchor="end">120ms (LLM)</text>
    <text x="26" y="305" fill="#64748b" font-size="10">Compute Cost:</text>
    <text x="235" y="305" fill="#f59e0b" font-size="11" font-weight="bold" text-anchor="end">$$$ (LLM Calls)</text>
    <text x="26" y="322" fill="#64748b" font-size="10">Context Retention:</text>
    <text x="235" y="322" fill="#c084fc" font-size="11" font-weight="bold" text-anchor="end">98%</text>

    <!-- Footer recommendation -->
    <rect x="16" y="340" width="233" height="28" rx="4" fill="#8b5cf6" fill-opacity="0.1" stroke="#8b5cf6" stroke-opacity="0.3"/>
    <text x="132" y="358" fill="#e9d5ff" font-size="10" font-weight="600" text-anchor="middle">🏆 Best for high-value legal / compliance</text>
  </g>

  <!-- Bottom Global Workflow Pipeline Bar -->
  <g transform="translate(40, 500)">
    <rect width="1120" height="60" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="24" y="26" fill="#38bdf8" font-size="11" font-weight="700">PRODUCTION WORKFLOW PIPELINE:</text>
    <text x="24" y="44" fill="#64748b" font-size="10">End-to-end multi-tier ingestion flow:</text>

    <rect x="230" y="16" width="145" height="30" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="302" y="35" fill="#cbd5e1" font-size="10" text-anchor="middle">1. Structural Parsing</text>
    <line x1="375" y1="31" x2="395" y2="31" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="400" y="16" width="155" height="30" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="477" y="35" fill="#cbd5e1" font-size="10" text-anchor="middle">2. Parent-Child Slicing</text>
    <line x1="555" y1="31" x2="575" y2="31" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="580" y="16" width="165" height="30" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="662" y="35" fill="#cbd5e1" font-size="10" text-anchor="middle">3. Contextual Enrichment</text>
    <line x1="745" y1="31" x2="765" y2="31" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="770" y="16" width="150" height="30" rx="4" fill="#1e293b" stroke="#334155"/>
    <text x="845" y="35" fill="#cbd5e1" font-size="10" text-anchor="middle">4. Dense Embedding</text>
    <line x1="920" y1="31" x2="940" y2="31" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="945" y="16" width="155" height="30" rx="4" fill="#065f46" fill-opacity="0.4" stroke="#10b981"/>
    <text x="1022" y="35" fill="#34d399" font-size="10" font-weight="bold" text-anchor="middle">5. Vector + BM25 Hybrid</text>
  </g>
</svg>
