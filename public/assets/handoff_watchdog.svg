<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs><linearGradient id="hwbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#101a30"/></linearGradient>
<linearGradient id="hwred" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/></linearGradient>
<linearGradient id="hwgrn" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient>
<marker id="hwarr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,1 L7,4 L0,7 Z" fill="#38bdf8"/></marker></defs>
<rect width="1200" height="430" fill="url(#hwbg)" rx="12"/>
<text x="40" y="48" fill="#fff" font-size="24" font-weight="800">Grade the seams, not just the final text</text>
<text x="40" y="72" fill="#94a3b8" font-size="13">Empty-200 handoffs sail through tone checks. A watchdog between nodes halts them.</text>
<g font-size="12" font-weight="700">
<rect x="40" y="100" width="300" height="90" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/><text x="56" y="128" fill="#38bdf8">1 · classify ticket</text><text x="56" y="150" fill="#e2e8f0" font-weight="400">node output: label</text><text x="56" y="170" fill="#64748b" font-weight="400">checked: trivially fine</text>
<rect x="380" y="100" width="300" height="90" rx="10" fill="url(#hwred)"/><text x="396" y="128" fill="#fff">2 · billing lookup → 200 EMPTY</text><text x="396" y="150" fill="#fecaca" font-weight="400">valid shape, zero records</text><text x="396" y="170" fill="#fff" font-weight="400">eval sees: success ✓ (lie)</text>
<rect x="720" y="100" width="200" height="90" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/><text x="736" y="128" fill="#f59e0b">◉ WATCHDOG</text><text x="736" y="150" fill="#e2e8f0" font-weight="400">IDs match? records?</text><text x="736" y="170" fill="#e2e8f0" font-weight="400">HALT + alert</text>
<rect x="960" y="100" width="200" height="90" rx="10" fill="url(#hwgrn)"/><text x="976" y="128" fill="#fff">3 · draft (gated)</text><text x="976" y="150" fill="#d1fae5" font-weight="400">only clean handoffs</text><text x="976" y="170" fill="#fff" font-weight="400">no polite wrongness</text>
</g>
<g stroke="#38bdf8" stroke-width="2" marker-end="url(#hwarr)"><line x1="340" y1="145" x2="378" y2="145"/><line x1="680" y1="145" x2="718" y2="145"/><line x1="920" y1="145" x2="958" y2="145"/></g>
<rect x="40" y="215" width="560" height="75" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="243" fill="#fff" font-size="12" font-weight="700">Watchdog rules: Pydantic schema · one narrow question · floor 0.35 · fail-closed · gate external acts</text>
<text x="60" y="265" fill="#94a3b8" font-size="11">Small local model: fast + binary, not clever. Start at the last handoff before externals.</text>
<rect x="620" y="215" width="540" height="75" rx="10" fill="#0f172a" stroke="#ef4444" stroke-width="2"/>
<text x="640" y="243" fill="#ef4444" font-size="12" font-weight="800">Costs: latency (2 calls) · false halts · judgment</text>
<text x="640" y="265" fill="#e2e8f0" font-size="11">Gate where being-wrong beats the hop. Final text can lie; trajectory can't.</text>
<rect x="40" y="310" width="1120" height="80" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="336" fill="#fff" font-size="12" font-weight="700">Datadog 2026: ~5% AI requests fail · ~40% silently (complete-but-wrong). The expensive failure is the 200, never the 500.</text>
<text x="60" y="360" fill="#94a3b8" font-size="11">Simulator: empty-200 · ID mismatch · low-confidence vs floor slider → PASS/HALT + reason.</text>
</svg>
