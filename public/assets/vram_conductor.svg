<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs><linearGradient id="vcbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#090d16"/><stop offset="100%" stop-color="#101a30"/></linearGradient>
<linearGradient id="vcred" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#b91c1c"/></linearGradient>
<linearGradient id="vcgrn" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient></defs>
<rect width="1200" height="410" fill="url(#vcbg)" rx="12"/>
<text x="40" y="48" fill="#fff" font-size="24" font-weight="800">Three terminals, one 8GB card, two funerals — then a ledger</text>
<text x="40" y="72" fill="#94a3b8" font-size="13">KV reserved up front kills agents 2–3. A 90% ledger + book-before-build admits all three.</text>
<g font-size="12" font-weight="700">
<rect x="40" y="100" width="330" height="100" rx="10" fill="url(#vcred)"/><text x="56" y="128" fill="#fff">Naive: 6,536 MiB first</text><text x="56" y="150" fill="#fecaca" font-weight="400">KV for full ctx, pre-decode</text><text x="56" y="170" fill="#fecaca" font-weight="400">cudaMalloc lottery past 80%</text><text x="56" y="190" fill="#fff" font-weight="400">1 survivor + 2 crash logs</text>
<rect x="390" y="100" width="330" height="100" rx="10" fill="url(#vcgrn)"/><text x="406" y="128" fill="#fff">lmxd: 1.58/7.73 GB</text><text x="406" y="150" fill="#d1fae5" font-weight="400">ledger + one backend</text><text x="406" y="170" fill="#d1fae5" font-weight="400">KV swap to host per DECODE</text><text x="406" y="190" fill="#fff" font-weight="400">3 alive · 926 MiB steady</text>
<rect x="740" y="100" width="420" height="100" rx="10" fill="#0f172a" stroke="#c9a84c" stroke-width="2"/><text x="756" y="128" fill="#c9a84c">Layer streaming +22–32%</text><text x="756" y="150" fill="#e2e8f0" font-weight="400">1 layer resident · prefetch next</text><text x="756" y="170" fill="#e2e8f0" font-weight="400">compute ∥ transfer, 2 streams</text><text x="756" y="190" fill="#64748b" font-weight="400">FMA-representative scope, honestly</text>
</g>
<rect x="40" y="220" width="1120" height="60" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="244" fill="#fff" font-size="12" font-weight="700">Telecom déjà vu: 5G admission control — budget check before bearer, reject spares live calls.</text>
<text x="60" y="266" fill="#94a3b8" font-size="11">Refusing impossible work beats optimizing possible work. Denials explain themselves.</text>
<rect x="40" y="300" width="720" height="70" rx="10" fill="#0f172a" stroke="#334155"/>
<text x="60" y="326" fill="#fff" font-size="12" font-weight="700">Simulator: queue models at a card → admit/deny ledger walk.</text>
<text x="60" y="348" fill="#94a3b8" font-size="11">Out of scope, stated: concurrent decode · live NVML · multi-GPU · full transformer port.</text>
<rect x="780" y="300" width="380" height="70" rx="10" fill="url(#vcgrn)"/>
<text x="800" y="326" fill="#fff" font-size="12" font-weight="800">Rule: book before build. Always.</text>
<text x="800" y="348" fill="#d1fae5" font-size="11">Mutex compare-and-bump, unwind on failure.</text>
</svg>
